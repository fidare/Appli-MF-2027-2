<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette héroïnes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  Maquette : les Miss « déguisées » en super-héroïnes par un habillage
  SVG posé sur leur photo (col d'armure et emblème, aura de pouvoir,
  teinte de costume, nom de code). Page autonome, non reliée à l'appli :
  sert à valider le rendu avant de l'intégrer aux fiches.
-->
<style>
  :root {
    --bg: #06080f; --card: #0f1420; --ink: #f4f6fb; --text: #cdd4e2; --muted: #8592ab;
    --serif: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
    --sans: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-family: var(--sans);
    background:
      radial-gradient(70% 50% at 0% -5%, rgba(230,36,41,0.35), transparent 65%),
      radial-gradient(70% 50% at 100% 105%, rgba(47,111,214,0.3), transparent 65%),
      var(--bg);
    background-attachment: fixed;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 1.4rem 1rem 3rem; }
  h1 { font-family: var(--serif); font-weight: 400; letter-spacing: 0.05em; color: var(--ink); font-size: 2.4rem; margin: 0.2rem 0; text-align: center; }
  p.intro { text-align: center; color: var(--muted); max-width: 36rem; margin: 0.4rem auto 1.6rem; font-size: 0.92rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.2rem; }

  /* Carte de héroïne : coins coupés et liseré aux couleurs du pouvoir. */
  .hero {
    --cut: 18px;
    filter: drop-shadow(0 0 10px var(--glow));
  }
  .hero .frame {
    position: relative; padding: 2px; background: linear-gradient(160deg, var(--c1), rgba(255,255,255,0.15) 50%, var(--c2));
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  }
  .hero .ph {
    position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: #111827;
    clip-path: polygon(calc(var(--cut) - 1px) 0, 100% 0, 100% calc(100% - var(--cut) + 1px), calc(100% - var(--cut) + 1px) 100%, 0 100%, 0 calc(var(--cut) - 1px));
  }
  .hero .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.12) contrast(1.06); }
  /* Teinte de costume : couleur fondue dans la photo, plus forte vers les bords. */
  .hero .grade {
    position: absolute; inset: 0; mix-blend-mode: soft-light;
    background: radial-gradient(75% 60% at 50% 38%, transparent, var(--tint) 100%), linear-gradient(0deg, var(--tint), transparent 45%);
  }
  .hero .aura { position: absolute; inset: 0; box-shadow: inset 0 0 40px var(--glow), inset 0 0 4px var(--c1); }
  .hero svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .hero svg.fx { mix-blend-mode: screen; }
  .hero .bot { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: linear-gradient(180deg, transparent, rgba(4,6,12,0.55)); }

  .hero .alias { position: absolute; left: 0.8rem; top: 0.7rem; right: 0.8rem; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.7); }
  .hero .alias small { display: block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.3em; color: var(--c1); }
  .hero .alias b { display: block; font-family: var(--serif); font-weight: 400; font-size: 2rem; letter-spacing: 0.05em; color: #fff; margin-top: 0.15rem; }
  .hero .alias i { display: block; font-style: normal; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; color: var(--text); margin-top: 0.25rem; text-transform: uppercase; }
  .hero .under { padding: 0.7rem 0.2rem 0; text-align: center; }
  .hero .under .nom { font-family: var(--serif); font-size: 1.5rem; letter-spacing: 0.05em; color: var(--ink); line-height: 1; }
  .hero .under .reg { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.18em; color: var(--c1); text-transform: uppercase; margin-top: 0.2rem; }

  .foudre { --c1: #8fd0ff; --c2: #2f6fd6; --tint: rgba(60, 120, 255, 0.55); --glow: rgba(90, 160, 255, 0.55); }
  .armure { --c1: #ffd27a; --c2: #e62429; --tint: rgba(230, 60, 40, 0.5); --glow: rgba(255, 150, 70, 0.5); }
  .mystique { --c1: #ffb35c; --c2: #9b4dff; --tint: rgba(255, 140, 40, 0.45); --glow: rgba(255, 150, 60, 0.5); }

  @media (prefers-reduced-motion: no-preference) {
    .flick { animation: flick 2.4s steps(1) infinite; }
    .flick.b { animation-delay: 1.1s; }
    @keyframes flick { 0%, 100% { opacity: 1; } 8% { opacity: 0.2; } 12% { opacity: 1; } 46% { opacity: 0.7; } 50% { opacity: 0.1; } 54% { opacity: 1; } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 50% { opacity: 0.55; transform: scale(0.88); } }
    .spin { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin.rev { animation-duration: 9s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .aura { animation: aura 3.2s ease-in-out infinite; }
    @keyframes aura { 50% { opacity: 0.6; } }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Maquette : les Miss en super-héroïnes</h1>
  <p class="intro">Habillage dessiné par-dessus la photo : col d'armure et emblème, aura de pouvoir, teinte du costume et nom de code. Trois pouvoirs différents pour comparer.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
// Silhouette de remplacement si la photo ne charge pas.
var PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d7a96"/><stop offset="1" stop-color="#2a3247"/></linearGradient></defs>'
  + '<rect width="300" height="400" fill="url(#b)"/><path d="M40 400 C45 320 95 290 150 290 C205 290 255 320 260 400 Z" fill="#20283a"/>'
  + '<rect x="128" y="230" width="44" height="70" rx="18" fill="#c9a28a"/><ellipse cx="150" cy="185" rx="52" ry="64" fill="#d8b49b"/>'
  + '<path d="M96 190 C90 120 120 105 150 105 C190 105 214 130 205 205 C198 160 180 140 150 140 C120 140 102 160 96 190 Z" fill="#3b2a22"/></svg>');

var MISS = [
  { nom: "Julie Decroix", region: "Alsace", alias: "La Foudre", pouvoir: "Maîtresse des orages", style: "foudre",
    photo: "https://www.voici.fr/imgre/fit/~1~voi~2025~11~14~589caed8-6571-4237-84b1-4394b6b2e1fa.jpeg/620x925/quality/63/crop-from/center/focus-point/998%2C640/crop-zone/0%2C116-2000x1245/image.avif" },
  { nom: "Ainhoa Lahitete", region: "Aquitaine", alias: "Armure d'Or", pouvoir: "Armure high-tech", style: "armure",
    photo: "https://www.voici.fr/imgre/fit/~1~voi~2025~11~14~2b088570-2687-4994-afb7-29316b6dd9f9.jpeg/620x925/quality/63/crop-from/center/focus-point/895%2C689/crop-zone/0%2C109-2000x1287/image.avif" },
  { nom: "Alice De Lima Guimaraes", region: "Auvergne", alias: "L'Arcane", pouvoir: "Sorcière suprême", style: "mystique",
    photo: "https://www.voici.fr/imgre/fit/~1~voi~2025~11~14~912128a1-5536-4586-b786-2ea28aa62763.jpeg/620x925/quality/63/crop-from/center/focus-point/1096%2C501/crop-zone/8%2C0-1992x1339/image.avif" }
];

// Hasard reproductible : la même Miss a toujours les mêmes éclairs.
function rng(seed) { return function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; }

// Éclair fractal (déplacement du point médian), renvoyé en chemin SVG.
function bolt(r, x1, y1, x2, y2, disp, out) {
  if (disp < 4) { out.push("M" + x1.toFixed(1) + " " + y1.toFixed(1) + " L" + x2.toFixed(1) + " " + y2.toFixed(1)); return; }
  var mx = (x1 + x2) / 2 + (r() - 0.5) * disp * 2, my = (y1 + y2) / 2 + (r() - 0.5) * disp * 0.4;
  bolt(r, x1, y1, mx, my, disp / 2, out);
  bolt(r, mx, my, x2, y2, disp / 2, out);
  if (r() < 0.12) bolt(r, mx, my, mx + (r() - 0.5) * 60, my + 20 + r() * 40, disp / 2, out);
}

// Col d'armure et emblème de poitrine, posés en bas du portrait.
function armure(id, style) {
  var g = {
    foudre: ["#dfe7f5", "#7d8aa6", "#3b4560", "#8fd0ff"],
    armure: ["#ff6a5a", "#c41820", "#5e0a0e", "#ffd27a"],
    mystique: ["#4b5fa8", "#24306a", "#121935", "#ffb35c"]
  }[style];
  var gold = style === "armure" ? '<path d="M0 352 Q48 330 96 336 L112 360 L104 400 L0 400 Z M300 352 Q252 330 204 336 L188 360 L196 400 L300 400 Z" fill="url(#gl' + id + ')" opacity="0.9"/>' : "";
  var cape = style === "mystique" ? '<path d="M0 300 Q30 330 26 400 L0 400 Z M300 300 Q270 330 274 400 L300 400 Z" fill="#a3161d" opacity="0.92"/><path d="M8 318 Q52 300 92 318 L98 334 Q52 318 10 336 Z M292 318 Q248 300 208 318 L202 334 Q248 318 290 336 Z" fill="#c41820"/>' : "";
  var emb = style === "foudre"
    ? '<path d="M152 352 L141 372 L151 372 L146 392 L161 366 L151 366 L157 352 Z" fill="#fff"/>'
    : style === "armure"
    ? '<circle cx="150" cy="372" r="9" fill="#fff"/><circle cx="150" cy="372" r="14" fill="none" stroke="#bfe9ff" stroke-width="2"/>'
    : '<path d="M150 356 L156 372 L150 388 L144 372 Z" fill="#ffd9a0"/><circle cx="150" cy="372" r="15" fill="none" stroke="#ffb35c" stroke-width="1.5"/>';
  return '<svg viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true"><defs>'
    + '<linearGradient id="pl' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + g[0] + '"/><stop offset="0.5" stop-color="' + g[1] + '"/><stop offset="1" stop-color="' + g[2] + '"/></linearGradient>'
    + '<linearGradient id="gl' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c2"/><stop offset="0.5" stop-color="#f0c35a"/><stop offset="1" stop-color="#9a6a18"/></linearGradient>'
    + '<radialGradient id="em' + id + '"><stop offset="0" stop-color="#fff"/><stop offset="0.35" stop-color="' + g[3] + '"/><stop offset="1" stop-color="' + g[3] + '" stop-opacity="0"/></radialGradient></defs>'
    + cape
    // Épaulières et plastron.
    + '<path d="M0 334 Q50 304 104 316 L124 350 L116 400 L0 400 Z" fill="url(#pl' + id + ')"/>'
    + '<path d="M300 334 Q250 304 196 316 L176 350 L184 400 L300 400 Z" fill="url(#pl' + id + ')"/>'
    + '<path d="M104 316 L150 344 L196 316 L176 350 L184 400 L116 400 L124 350 Z" fill="url(#pl' + id + ')" opacity="0.95"/>'
    + gold
    // Liserés et reflets métalliques.
    + '<path d="M0 334 Q50 304 104 316 L150 344 L196 316 Q250 304 300 334" fill="none" stroke="' + g[3] + '" stroke-width="2" opacity="0.9"/>'
    + '<path d="M12 344 Q52 322 96 330 M288 344 Q248 322 204 330" fill="none" stroke="#fff" stroke-width="1" opacity="0.45"/>'
    + '<path d="M124 350 L150 366 L176 350" fill="none" stroke="#000" stroke-width="1" opacity="0.35"/>'
    // Emblème lumineux.
    + '<circle class="pulse" cx="150" cy="372" r="30" fill="url(#em' + id + ')"/>' + emb
    + '</svg>';
}

// Effet de pouvoir, en lumière additive sur la photo.
function pouvoir(id, style) {
  var h = '<svg class="fx" viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true">';
  if (style === "foudre") {
    var r = rng(91 + id), a = [], b = [];
    bolt(r, 18, -10, 40, 300, 60, a);
    bolt(r, 284, -10, 262, 280, 60, b);
    [a, b].forEach(function (p, i) {
      var d = p.join(" ");
      h += '<g class="flick' + (i ? " b" : "") + '" stroke-linecap="round" fill="none">'
        + '<path d="' + d + '" stroke="rgba(80,140,255,0.35)" stroke-width="9"/>'
        + '<path d="' + d + '" stroke="rgba(150,200,255,0.7)" stroke-width="3.5"/>'
        + '<path d="' + d + '" stroke="#fff" stroke-width="1.3"/></g>';
    });
  } else if (style === "armure") {
    // Interface de visée discrète et étincelles autour de l'emblème.
    h += '<g fill="none" stroke="rgba(255,210,122,0.75)" stroke-width="1.2">'
      + '<path d="M260 14 H286 V40"/>'
      + '<g class="spin"><circle cx="248" cy="82" r="20" stroke-dasharray="3 5"/></g>'
      + '<g class="spin rev"><path d="M248 66 A16 16 0 0 1 264 82 M248 98 A16 16 0 0 1 232 82"/></g></g>';
    var r2 = rng(7 + id);
    for (var i = 0; i < 18; i++) {
      var an = r2() * Math.PI * 2, d1 = 22 + r2() * 10, d2 = d1 + 8 + r2() * 16;
      h += '<line x1="' + (150 + Math.cos(an) * d1).toFixed(1) + '" y1="' + (372 + Math.sin(an) * d1).toFixed(1) + '" x2="' + (150 + Math.cos(an) * d2).toFixed(1) + '" y2="' + (372 + Math.sin(an) * d2).toFixed(1) + '" stroke="#ffe7b0" stroke-width="1" opacity="0.8"/>';
    }
  } else {
    // Cercles runiques qui tournent autour de la tête.
    var tk = "";
    for (var k = 0; k < 60; k++) {
      var t = k / 60 * Math.PI * 2, l = k % 5 ? 4 : 9;
      tk += "M" + (150 + Math.cos(t) * 112).toFixed(1) + " " + (165 + Math.sin(t) * 112).toFixed(1)
        + " L" + (150 + Math.cos(t) * (112 - l)).toFixed(1) + " " + (165 + Math.sin(t) * (112 - l)).toFixed(1) + " ";
    }
    h += '<g fill="none" stroke-linecap="round">'
      + '<g class="spin"><circle cx="150" cy="165" r="118" stroke="rgba(255,150,50,0.35)" stroke-width="6"/>'
      + '<circle cx="150" cy="165" r="118" stroke="#ffd9a0" stroke-width="1.6"/>'
      + '<path d="' + tk + '" stroke="#ffc27a" stroke-width="1.2"/></g>'
      + '<g class="spin rev"><rect x="72" y="87" width="156" height="156" stroke="rgba(255,190,110,0.6)" stroke-width="1"/>'
      + '<rect x="72" y="87" width="156" height="156" stroke="rgba(255,190,110,0.6)" stroke-width="1" transform="rotate(45 150 165)"/></g>'
      + '<circle cx="150" cy="165" r="96" stroke="rgba(255,200,130,0.55)" stroke-width="1"/></g>';
  }
  return h + '</svg>';
}

var html = "";
MISS.forEach(function (m, i) {
  html += '<article class="hero ' + m.style + '"><div class="frame"><div class="ph">'
    + '<img src="' + m.photo + '" alt="' + m.nom + '" onerror="this.onerror=null;this.src=PLACEHOLDER">'
    + '<div class="grade"></div>' + pouvoir(i, m.style) + '<div class="bot"></div>' + armure(i, m.style)
    + '<div class="aura"></div>'
    + '<div class="alias"><small>Alias</small><b>' + m.alias + '</b><i>' + m.pouvoir + '</i></div>'
    + '</div></div><div class="under"><div class="nom">' + m.nom + '</div><div class="reg">Miss ' + m.region + '</div></div></article>';
});
document.getElementById("grid").innerHTML = html;
</script>
</body>
</html>
