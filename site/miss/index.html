<style>

  nav.tabs button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }

  .steps { display: flex; margin: 1.2rem 0 0.2rem; }

  .step::before {

    background: var(--line);
  }
  .step:first-child::before { display: none; }
  .step.done::before, .step.on::before { background: var(--goldline); }
  .step .dot {
    position: relative; z-index: 1; display: inline-flex; width: 1.7rem; height: 1.7rem;
    border-radius: 50%; align-items: center; justify-content: center;
    font-size: 0.78rem; font-weight: 700; font-family: var(--serif); font-style: italic;
    background: var(--card2); border: 1px solid var(--line); color: var(--muted);
  }
  .step.done .dot { border-color: var(--goldline); color: var(--gold); }
  .step.on .dot {

  .step .lab { display: block; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.35rem; color: var(--muted); font-weight: 600; }
  .step.on .lab { color: var(--gold); }
  .phasedesc { text-align: center; font-size: 0.85rem; color: var(--muted); max-width: 34rem; margin: 0.7rem auto 1.1rem; }

  .logingrid button {
    border: 1px solid transparent;
    background:
      linear-gradient(160deg, var(--card2), var(--card)) padding-box,
      linear-gradient(160deg, rgba(240,207,125,0.45), rgba(240,207,125,0.06)) border-box;

    align-items: center; gap: 0.5rem; box-shadow: var(--shadow);
  }
  .logingrid button:hover, .logingrid button:focus-visible { outline: none; box-shadow: 0 0 20px rgba(240, 207, 125, 0.25), var(--shadow); }

  .pin {
    font-size: 1.6rem; letter-spacing: 0.8rem; text-align: center; width: 11rem;

    background: rgba(255, 255, 255, 0.05); color: var(--ink);
  }
  .pin:focus { outline: 2px solid var(--gold); }

  .row { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
  .listline { display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
  .listline:last-child { border-bottom: none; }
  .listline .grow { flex: 1; min-width: 0; }

  .bar { margin: 0.65rem 0; }
  .bar .top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; font-size: 0.82rem; margin-bottom: 0.28rem; }
  .bar .lbl { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bar.me .lbl { color: var(--gold); font-weight: 700; }
  .bar.me .fill { background: linear-gradient(90deg, #cf9a2c, #f3cf7a); box-shadow: 0 0 10px rgba(240, 207, 125, 0.5); }

  .rank {
    width: 2.4rem; height: 2.4rem; border-radius: 50%; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 1.05rem;
    border: 1px solid var(--line); color: var(--muted);

  .rank.r1 { background: linear-gradient(135deg, #f6dc94, #cf9a2c); color: #241a06; border: none; box-shadow: 0 0 16px rgba(240, 207, 125, 0.45); }
  .rank.r2 { background: linear-gradient(135deg, #e6e6ee, #a9adc2); color: #23263a; border: none; }
  .rank.r3 { background: linear-gradient(135deg, #e2aa7c, #a96a3c); color: #2e1806; border: none; }

  .search {

  #toast.err { background: var(--bad); color: #fff; }

  footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 2.4rem; }

  table.adm { width: 100%; border-collapse: collapse; font-size: 0.86rem; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .brand em {
      background-image: linear-gradient(110deg, var(--gold-deep) 0%, #fbedb4 30%, #fff3c4 38%, var(--gold-deep) 55%, var(--gold-deep) 100%);
      background-size: 220% 100%;
      animation: shine 4.5s linear infinite;
    }
    @keyframes shine { from { background-position: 120% 0; } to { background-position: -120% 0; } }
    .step.on .dot { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 14px rgba(240, 207, 125, 0.45); }
      50% { box-shadow: 0 0 26px rgba(240, 207, 125, 0.8); }
    }
    #toast { animation: rise 0.25s ease-out; }
    .entr .pan.l { animation: openL 1.25s cubic-bezier(0.76, 0, 0.24, 1) 1.15s forwards; }

    @keyframes openL { to { transform: translateX(-104%); } }
    @keyframes openR { to { transform: translateX(104%); } }
    .entr .mid { animation: midin 0.5s ease-out both, midout 0.55s ease-in 1.1s forwards; }
    @keyframes midin { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
    @keyframes midout { to { opacity: 0; transform: scale(1.08); } }
  }
  @media (prefers-reduced-motion: reduce) { .entr { display: none; } }

  @media (min-width: 700px) {
    .wrap { max-width: 960px; padding-left: 1rem; padding-right: 1rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.9rem; }
    .logingrid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .modal-bg { align-items: center; padding: 1rem; }
    .modal { border-radius: 22px; }
  }
</style>

// ------------------------------------------------------------------
// API
// ------------------------------------------------------------------
function api(method, path, body) {
  return fetch(SUPABASE.url + path, {
    method: method,
    headers: { "Content-Type": "application/json", "apikey": SUPABASE.anonKey },
    body: body === undefined ? undefined : JSON.stringify(body)
  }).then(function (r) {
    if (r.status === 204) return null;
    return r.json().then(function (data) {
      if (!r.ok) {
        var msg = (data && (data.message || data.hint || data.error)) || ("Erreur " + r.status);
        throw new Error(msg);
      }
      return data;
    });
  });
}
function rpc(name, params) { return api("POST", "/rest/v1/rpc/" + name, params || {}); }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

var toastTimer = null;
function toast(msg, isErr) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = isErr ? "err" : "";
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = "none"; }, 3200);
}

// ------------------------------------------------------------------
// Chargement des données
// ------------------------------------------------------------------
function loadConfig() {
  return api("GET", "/rest/v1/mf_config?id=eq.1&select=*").then(function (r) { S.config = r[0]; });
}
function loadCandidates() {
  return api("GET", "/rest/v1/mf_candidates?select=*&order=region.asc").then(function (r) { S.candidates = r; });
}
function loadJoueurs() {
  return api("GET", "/rest/v1/mf_joueurs_public?select=*&order=nom_affiche.asc").then(function (r) { S.joueurs = r; });
}
function loadMine() {
  if (!S.session) return Promise.resolve();
  return rpc("mf_mes_pronostics", { p_jeton: S.session.jeton }).then(function (rows) {
    S.mine = {};
    rows.forEach(function (p) { S.mine[p.candidate_id] = p; });
  });
}
function loadProfil() {
  if (!S.session) return Promise.resolve();
  return rpc("mf_mon_profil", { p_jeton: S.session.jeton }).then(function (rows) {
    if (!rows || !rows.length) throw new Error("session périmée");
    S.profil = rows[0];
  });
}

function boot() {
  try { S.session = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) {}
  Promise.all([loadConfig(), loadCandidates(), loadJoueurs()])
    .then(function () {
      if (!S.session) return;
      return Promise.all([loadProfil(), loadMine()]).catch(function () { logout(false); });
    })
    .then(render)
    .catch(function (e) {
      document.getElementById("app").innerHTML =
        '<div class="card center">😢 Impossible de joindre la base du concours.<br><span class="small muted">' +
        esc(e.message) + '</span><br><br><button class="btn" onclick="location.reload()">Réessayer</button></div>';
    });
}

// ------------------------------------------------------------------
// Paillettes ✨ — gerbes sur les votes, pluies pour les grands moments.
// ------------------------------------------------------------------
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var GL_COLORS = ["#f6dc94", "#f0cf7d", "#ffd98a", "#ff9ac6", "#ffffff", "#ffcf5e"];

document.addEventListener("pointerdown", function (e) {
  S.tap = { x: e.clientX, y: e.clientY };
}, true);

function glitterLayer() {
  var l = document.getElementById("glitter");
  if (!l) { l = document.createElement("div"); l.id = "glitter"; document.body.appendChild(l); }
  return l;
}

function glSpawn(x, y, dx, dy, dur, rot) {
  var l = glitterLayer();
  var s = document.createElement("span");
  s.className = "gl";
  var size = 4 + Math.random() * 5;
  s.style.width = size + "px";
  s.style.height = size + "px";
  s.style.background = GL_COLORS[Math.floor(Math.random() * GL_COLORS.length)];
  s.style.left = x + "px";
  s.style.top = y + "px";
  l.appendChild(s);
  s.animate([
    { transform: "translate(-50%,-50%) rotate(0deg) scale(1)", opacity: 1 },
    { transform: "translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg) scale(0.25)", opacity: 0 }
  ], { duration: dur, easing: "cubic-bezier(0.2, 0.6, 0.3, 1)" });
  setTimeout(function () { s.remove(); }, dur);
}

// Gerbe au point du dernier clic (ou au centre).
function burstAt(x, y, n) {
  if (REDUCED) return;
  for (var i = 0; i < (n || 16); i++) {
    var ang = Math.random() * Math.PI * 2;
    var dist = 45 + Math.random() * 75;
    glSpawn(x, y, Math.cos(ang) * dist, Math.sin(ang) * dist + 45,
      700 + Math.random() * 500, Math.random() * 420 - 210);
  }
}
function burst(n) {
  burstAt(S.tap ? S.tap.x : window.innerWidth / 2,
    S.tap ? S.tap.y : window.innerHeight / 3, n);
}

// Pluie de paillettes depuis le haut de l'écran.
function glitterRain(duration) {
  if (REDUCED) return;
  var end = Date.now() + (duration || 3000);
  var timer = setInterval(function () {
    if (Date.now() > end) { clearInterval(timer); return; }
    for (var i = 0; i < 5; i++) {
      glSpawn(Math.random() * window.innerWidth, -12,
        (Math.random() - 0.5) * 140, window.innerHeight + 60,
        2200 + Math.random() * 1800, 360 + Math.random() * 360);
    }
  }, 130);
}

// Lever de rideau après la saisie du PIN : deux pans de velours rouge
// à liseré d'or s'ouvrent sur le jeu.
function playEntrance(nom) {
  var d = document.createElement("div");
  d.className = "entr";
  d.innerHTML = '<div class="pan l"></div><div class="pan r"></div>'
    + '<div class="mid"><div class="brand-crown">' + icon("crown") + '</div>'
    + '<span class="eyebrow">Miss France 2027</span>'
    + '<div class="brand">Que le show <em>commence&nbsp;!</em></div>'
    + '<div class="who" style="font-family:var(--serif);font-style:italic;color:var(--ink);font-size:1.1rem">' + esc(nom) + '</div></div>';
  document.body.appendChild(d);
  setTimeout(function () { glitterRain(1500); }, 1150);
  setTimeout(function () { d.remove(); }, 2600);
}

function logout(re) {
  S.session = null; S.profil = null; S.mine = {}; S.tab = "accueil";
  localStorage.removeItem(STORE_KEY);
  if (re !== false) render();
}

function refresh(alsoCand) {
  var jobs = [loadMine()];
  if (alsoCand) jobs.push(loadCandidates(), loadConfig());
  return Promise.all(jobs).then(render);
}

  goTab: function (t) {
    S.tab = t; S.res = null; S.avancement = null; S.admJoueurs = null;
    render();
    if (t === "benchmark") loadBenchmark();
    if (t === "selection") loadAvancement();
    if (t === "admin") loadAdmin();
    if (S.config && S.config.phase === "resultats" && (t === "resultat" || t === "benchmark") && !S.sacreShown) {
      S.sacreShown = true;
      glitterRain(4000);
    }
  },
  pickJoueur: function (id) {
    S.loginSel = S.joueurs.find(function (j) { return j.id === id; }) || null;
    render();
    var el = document.getElementById("pin-input");
    if (el) el.focus();
  },
  backLogin: function () { S.loginSel = null; render(); },
  tryPin: function (ev) {
    if (ev) ev.preventDefault();
    var el = document.getElementById("pin-input");
    var pin = (el && el.value || "").trim();
    if (!/^[0-9]{4}$/.test(pin)) { toast("Le PIN, c'est 4 chiffres !", true); return false; }
    rpc("mf_connexion", { p_pseudo: S.loginSel.pseudo, p_pin: pin })
      .then(function (rows) {
        if (!rows || !rows.length) { toast("PIN incorrect… L'huissier te surveille. 👀", true); return; }
        S.session = { jeton: rows[0].jeton, pseudo: S.loginSel.pseudo };
        localStorage.setItem(STORE_KEY, JSON.stringify(S.session));
        S.loginSel = null;
        playEntrance(rows[0].nom_affiche);
        return Promise.all([loadProfil(), loadMine()]).then(render);
      })
      .catch(function (e) { toast(e.message, true); });
    return false;
  },
  logout: function () { logout(); },

  statut: function (cid, st) {
    rpc("mf_definir_statut", { p_jeton: S.session.jeton, p_candidate: cid, p_statut: st })
      .then(function () {
        if (st === "top15" || st === "top5") burst();
        return refresh();
      })
      .catch(function (e) { toast(e.message, true); });
  },
  rang: function (cid, sel) {
    var v = sel.value === "" ? null : parseInt(sel.value, 10);
    rpc("mf_definir_rang", { p_jeton: S.session.jeton, p_candidate: cid, p_rang: v })
      .then(function () { return refresh(); })
      .catch(function (e) { toast(e.message, true); refresh(); });
  },
  essai: function (essai, cid) {
    rpc("mf_definir_essai", { p_jeton: S.session.jeton, p_essai: essai, p_candidate: cid })
      .then(function () {
        if (cid) burst(20);
        return refresh();
      })
      .catch(function (e) { toast(e.message, true); });

  search: function (inp) { S.q = inp.value; renderKeepFocus(inp, "search-input"); },
  admSearch: function (inp) { S.admQ = inp.value; renderKeepFocus(inp, "adm-search"); },
  fiche: function (cid) { S.fiche = cid; S.ficheSurprise = false; render(); },

      })

      .catch(function (e) { toast(e.message, true); });

// ------------------------------------------------------------------
// Rendu
// ------------------------------------------------------------------
function avatarHtml(nom, url, big) {
  var cls = "avatar" + (big ? " big" : "");
  if (url) return '<span class="' + cls + '"><img src="' + esc(url) + '" alt=""></span>';
  var initials = nom.replace(/^(Mister|Miss)\s+/i, "").split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
  return '<span class="' + cls + '">' + esc(initials || "?") + '</span>';
}

function missPhoto(c, surprise) {
  var url = surprise && c.photo_surprise_url ? c.photo_surprise_url : c.photo_url;
  return url ? '<img src="' + esc(url) + '" alt="' + esc(c.nom) + '" loading="lazy">' : icon("crown");
}

function statutBadge(p) {
  if (!p) return "";
  var h = "";
  if (p.statut === "top15") h += '<span class="badge pink">' + icon("check") + ' Dans mon équipe</span>';
  if (p.top5) h += '<span class="badge gold">' + icon("star") + ' Dans mes 5</span>';
  if (p.rang) h += '<span class="badge gold">Mon ordre : Nº' + p.rang + '</span>';
  if (p.essai === 1) h += '<span class="badge gold">' + icon("crown") + ' Essai 1</span>';
  if (p.essai === 2) h += '<span class="badge gold">' + icon("crown") + ' Essai 2</span>';
  return h;
}

function finalisteBadge(c) {
  if (c.est_finaliste) return '<span class="badge gold">' + icon("crown") + ' Finaliste officielle</span>';
  var ph = S.config.phase;
  var top15Connu = S.candidates.some(function (x) { return x.dans_top15; });
  if (top15Connu && (ph === "top5" || ph === "ordre" || ph === "cloture" || ph === "resultats")) {
    return c.dans_top15
      ? '<span class="badge pink">Encore en lice</span>'
      : '<span class="badge dark">Éliminée</span>';
  }
  return "";
}

function missActions(c) {
  if (S.profil && S.profil.fige) return "";
  var p = S.mine[c.id];
  var ph = S.config.phase;
  var st = p ? p.statut : null;
  var h = "";
  var e = p ? p.essai : null;
  if (ph === "selection15") {
    if (st === "top15") h += btn("App.statut(" + c.id + ",'aucun')", "Retirer de mon équipe", "ghost mini");
    else h += btn("App.statut(" + c.id + ",'top15')", "Je la veux dans mon équipe !", "mini");
    h += e === 1 ? btn("App.essai(1,null)", "Annuler l'essai Nº1", "ghost mini") : btn("App.essai(1," + c.id + ")", icon("crown") + " Mon essai Nº1", "gold mini");
  } else if (ph === "top5") {
    if (!c.dans_top15) return "";
    if (p && p.top5) h += btn("App.statut(" + c.id + ",'aucun')", "Retirer de mes 5", "ghost mini");
    else h += btn("App.statut(" + c.id + ",'top5')", icon("star") + " Dans mes 5 !", "mini");
    h += e === 2 ? btn("App.essai(2,null)", "Annuler l'essai Nº2", "ghost mini") : btn("App.essai(2," + c.id + ")", icon("crown") + " Mon essai Nº2", "gold mini");
  } else if (ph === "ordre") {
    if (c.est_finaliste) h += rangSelect(c.id, p && p.rang);
  }
  return h;
}

function btn(onclick, label, cls) {
  label = label.replace(/ !/g, "&nbsp;!");
  return '<button class="btn ' + (cls || "") + '" onclick="' + onclick + '">' + label + '</button>';
}

function rangSelect(cid, cur) {
  var h = '<label class="small muted">Place finale : </label><select class="inp" onchange="App.rang(' + cid + ', this)">';
  h += '<option value=""' + (cur ? "" : " selected") + '>—</option>';
  for (var i = 1; i <= 5; i++) {
    h += '<option value="' + i + '"' + (cur === i ? " selected" : "") + '>Nº' + i + (i === 1 ? " (Miss France)" : "") + '</option>';
  }
  return h + "</select>";
}

function renderKeepFocus(inp, id) {
  var pos = inp.selectionStart;
  render();
  var el = document.getElementById(id);
  if (el) { el.focus(); el.setSelectionRange(pos, pos); }
}

function render() {
  var app = document.getElementById("app");
  // Les animations d'apparition ne jouent que lors d'un vrai changement
  // d'écran — jamais sur une simple mise à jour du même écran (vote,
  // rafraîchissement auto, frappe dans la recherche…).
  var sig = !S.config ? "boot" : (!S.session || !S.profil) ? "login" : S.tab + "|" + S.config.phase;
  app.classList.toggle("noanim", sig === S.lastSig);
  S.lastSig = sig;
  if (!S.config) { app.innerHTML = '<div class="card center">Base non initialisée : exécute <code>miss-france.sql</code> dans Supabase.</div>'; return; }
  if (!S.session || !S.profil) { app.innerHTML = viewLogin(); return; }

  var html = viewHeader();
  if (S.tab === "accueil") html += viewAccueil();
  else if (S.tab === "selection") html += viewSelection();
  else if (S.tab === "resultat") html += viewResultat();
  else if (S.tab === "benchmark") html += viewBenchmark();
  else if (S.tab === "admin") html += viewAdmin();
  html += '<footer>Concours privé entre ami·e·s · Aucune Miss n\'a été blessée pendant ces pronostics 👠</footer>';
  html += viewFiche();
  app.innerHTML = html;
}

// ----- Header commun -----
function stepperHtml() {
  var steps = [["selection15", "Les 15"], ["top5", "Les 5"], ["ordre", "L'ordre"], ["cloture", "Le sacre"]];
  var idx = { preparation: -1, selection15: 0, top5: 1, ordre: 2, cloture: 3, resultats: 3 }[S.config.phase];
  if (idx === undefined) idx = -1;
  var ph = PHASES[S.config.phase] || { label: S.config.phase, desc: "" };
  var h = '<div class="steps">';
  steps.forEach(function (s, i) {
    var cls = i < idx ? "done" : i === idx ? "on" : "";
    h += '<div class="step ' + cls + '"><span class="dot">' + (i < idx ? icon("check") : i + 1) + '</span><span class="lab">' + s[1] + '</span></div>';
  });
  h += '</div><p class="phasedesc">' + ph.desc + '</p>';
  return h;
}

function viewHeader() {

    + '<div class="masthead"><span class="eyebrow">Miss France 2027</span>'

function myCounts() {
  var t15 = 0, t5 = 0, ranges = 0, e1 = false, e2 = false;
  Object.keys(S.mine).forEach(function (k) {
    var p = S.mine[k];
    if (p.statut === "top15") t15++;
    if (p.top5) t5++;
    if (p.rang) ranges++;
    if (p.essai === 1) e1 = true;
    if (p.essai === 2) e2 = true;
  });
  return { t15: t15, t5: t5, ranges: ranges, e1: e1, e2: e2 };
}

// Encadré « huissier de justice » : sceller / récupérer sa sélection.
function huissierCard() {
  var ph = S.config.phase;
  if (ph !== "selection15" && ph !== "top5" && ph !== "ordre") return "";
  var c = myCounts();
  if (S.profil.fige) {
    return '<div class="card center">'
      + '<span class="badge gold">' + icon("award") + ' Dossier scellé chez l\'huissier de justice</span>'
      + '<p class="small muted" style="margin:0.5rem 0">Ta sélection est officielle — plus aucune modification possible.</p>'
      + btn("App.defiger()", "Récupérer mon dossier", "ghost mini") + '</div>';
  }
  var ready = false, manques = [];
  if (ph === "selection15") {
    if (c.t15 < 15) manques.push((15 - c.t15) + " Miss à recruter");
    if (!c.e1) manques.push("ton essai Miss France Nº1 à poser");
    ready = !manques.length;
  } else if (ph === "top5") {
    if (c.t5 < 5) manques.push((5 - c.t5) + " finaliste(s) à choisir");
    if (!c.e2) manques.push("ton essai Nº2 à poser");
    ready = !manques.length;
  } else if (ph === "ordre") {
    if (c.ranges < 5) manques.push((5 - c.ranges) + " rang(s) à attribuer");
    ready = !manques.length;
  }
  var hint = "Avant de pouvoir sceller : " + manques.join(" et ") + ".";
  return '<div class="card center">'
    + (ready
      ? btn("App.figer()", icon("award") + " Envoyer à l'huissier de justice !", "gold")
        + '<p class="small muted" style="margin:0.4rem 0 0">Sceller ta sélection la rend officielle (tu pourras récupérer ton dossier tant que la phase est ouverte).</p>'
      : '<p class="small muted" style="margin:0">' + icon("award") + ' ' + hint + '</p>')
    + '</div>';
}

// ----- Accueil : galerie -----
function viewAccueil() {
  var c = myCounts();
  var h = '<h2>Les Jeunettes en lice :</h2>'
    + '<p class="small muted">Mon équipe : <span class="cnt">' + c.t15 + ' / 15</span> · Mes finalistes : <span class="cnt">' + c.t5 + ' / 5</span></p>'
    + huissierCard()
    + '<input id="search-input" class="search" placeholder="Chercher un prénom, une région…" value="' + esc(S.q) + '" oninput="App.search(this)">';

  // Filtrage automatique selon les résultats réels saisis en Régie :
  // dès que le top 15 officiel est connu, les éliminées disparaissent ;
  // en phase d'ordre final, seules les 5 finalistes restent.
  var ph = S.config.phase;
  var base = S.candidates;
  var finConnues = S.candidates.some(function (x) { return x.est_finaliste; });
  var top15Connu = S.candidates.some(function (x) { return x.dans_top15; });
  var note = "";
  if (ph === "ordre" && finConnues) {
    base = base.filter(function (x) { return x.est_finaliste; });
    note = "Les 5 finalistes officielles — les autres ont quitté la scène.";
  } else if ((ph === "top5" || ph === "ordre" || ph === "cloture" || ph === "resultats") && top15Connu) {
    base = base.filter(function (x) { return x.dans_top15; });
    note = "Les " + base.length + " Miss encore en course — les éliminées ont quitté la scène.";
  }
  if (note) h += '<p class="small muted center" style="margin:0 0 0.6rem">' + note + '</p>';

  var q = S.q.trim().toLowerCase();
  var list = base.filter(function (x) {
    return !q || (x.nom + " " + x.region).toLowerCase().indexOf(q) >= 0;
  });

  if (!S.candidates.length) {
    return h + '<div class="card center muted">Le casting n\'est pas encore arrivé… L\'organisateur prépare les fiches des candidates. 💅</div>';
  }
  if (!list.length) return h + '<div class="card center muted">Personne ne correspond à cette recherche.</div>';

  h += '<div class="grid">';
  list.forEach(function (x, i) {
    var p = S.mine[x.id];
    h += '<article class="miss' + (p && (p.statut === "top15" || p.top5) ? " selected" : "") + '" style="animation-delay:' + Math.min(i * 45, 700) + 'ms">'
      + '<div class="ph" onclick="App.fiche(' + x.id + ')">' + missPhoto(x)
      + '<div class="num">' + (i + 1 < 10 ? "0" : "") + (i + 1) + '</div>'
      + '<div class="cap"><div class="nom">' + esc(x.nom) + '</div>'
      + '<div class="reg">Miss ' + esc(x.region) + (x.age ? " · " + esc(x.age) + " ans" : "") + '</div></div></div>'
      + '<div class="body">'
      + (x.profession ? '<span class="meta">' + esc(x.profession) + '</span>' : "")
      + '<div>' + finalisteBadge(x) + statutBadge(p) + '</div>'
      + '<div class="actions">' + missActions(x) + '</div>'
      + '</div></article>';
  });
  return h + "</div>";
}

// ----- Ma sélection -----
function viewSelection() {
  var byId = {};
  S.candidates.forEach(function (x) { byId[x.id] = x; });
  var top15 = [], top5 = [], essais = [null, null, null];
  Object.keys(S.mine).forEach(function (k) {
    var p = S.mine[k], x = byId[k];
    if (!x) return;
    if (p.statut === "top15") top15.push([x, p]);
    if (p.top5) top5.push([x, p]);
    if (p.essai === 1) essais[1] = [x, p];
    if (p.essai === 2) essais[2] = [x, p];
  });
  var sortNom = function (a, b) { return a[0].nom.localeCompare(b[0].nom); };
  top5.sort(sortNom);
  top15.sort(sortNom);
  var c = myCounts();

  function ligne(x, p, extra) {
    return '<div class="listline">'
      + '<span class="avatar" style="cursor:pointer" onclick="App.fiche(' + x.id + ')">' + missPhoto(x) + '</span>'
      + '<div class="grow"><b style="color:var(--pink);cursor:pointer" onclick="App.fiche(' + x.id + ')">' + esc(x.nom) + '</b>'
      + '<div class="small muted">Miss ' + esc(x.region) + '</div></div>'
      + '<div>' + (extra || "") + '</div></div>';
  }

  var h = '<h2>Ma sélection</h2>'
    + '<p class="small muted">Miss retenues : <span class="cnt">' + c.t15 + ' / 15</span> — brouillon enregistré automatiquement ; scelle-le chez l\'huissier pour le rendre officiel.</p>'
    + huissierCard();

  h += '<div class="card"><h3>' + icon("star") + ' Mes 5 finalistes (' + c.t5 + '/5)</h3>';
  var locked = !!S.profil.fige;
  h += top5.length ? top5.map(function (e) {
    var extra = "";
    if (S.config.phase === "top5" && !locked) extra += btn("App.statut(" + e[0].id + ",'aucun')", icon("trash"), "ghost mini");
    return ligne(e[0], e[1], extra);
  }).join("") : '<p class="muted small">Personne pour l\'instant… (phase 2)</p>';
  h += '</div>';

  var finalistes = S.candidates.filter(function (x) { return x.est_finaliste; });
  if (finalistes.length) {
    var ordreOuvert = S.config.phase === "ordre" && !locked;
    h += '<div class="card"><h3>' + icon("trophy") + ' Mon ordre final des 5 finalistes</h3>'
      + '<p class="small muted">La Nº1 est ta Miss France pronostiquée.</p>';
    finalistes.sort(function (a, b) {
      var pa = S.mine[a.id], pb = S.mine[b.id];
      return ((pa && pa.rang) || 9) - ((pb && pb.rang) || 9);
    });
    finalistes.forEach(function (x) {
      var p = S.mine[x.id];
      var extra = ordreOuvert ? rangSelect(x.id, p && p.rang)
        : (p && p.rang ? '<span class="badge gold">Nº' + p.rang + '</span>' : '<span class="small muted">—</span>');
      h += '<div class="listline"><span class="avatar" style="cursor:pointer" onclick="App.fiche(' + x.id + ')">' + missPhoto(x) + '</span>'
        + '<div class="grow"><b style="color:var(--pink);cursor:pointer" onclick="App.fiche(' + x.id + ')">' + esc(x.nom) + '</b>'
        + '<div class="small muted">Miss ' + esc(x.region) + '</div></div>'
        + '<div>' + extra + '</div></div>';
    });
    h += '</div>';
  }

  h += '<div class="card"><h3>' + icon("crown") + ' Mes essais Miss France</h3>';
  [1, 2].forEach(function (n) {
    var e = essais[n];
    h += '<div class="listline"><span class="badge gold">Essai ' + n + '</span><div class="grow">'
      + (e ? '<b style="color:var(--pink)">' + esc(e[0].nom) + '</b> <span class="small muted">Miss ' + esc(e[0].region) + '</span>' : '<span class="muted small">— pas encore choisie —</span>')
      + '</div>' + (e && !locked && ((n === 1 && S.config.phase === "selection15") || (n === 2 && S.config.phase === "top5"))
        ? btn("App.essai(" + n + ",null)", "Annuler", "ghost mini") : "") + '</div>';
  });
  h += '</div>';

  h += '<div class="card"><h3>' + icon("heart") + ' Mon équipe des 15 (' + c.t15 + '/15)</h3>';
  h += top15.length ? top15.map(function (e) {
    var extra = statutBadge(e[1]);
    if (!locked && S.config.phase === "selection15") extra += btn("App.statut(" + e[0].id + ",'aucun')", icon("trash"), "ghost mini");
    return ligne(e[0], e[1], extra);
  }).join("") : '<p class="muted small">Ton équipe est vide. Fonce à l\'Accueil recruter !</p>';
  h += '</div>';

  if (S.avancement) {
    h += '<div class="card"><h3>' + icon("users") + ' Où en sont les autres ?</h3><p class="small muted">Leurs choix restent secrets — seul l\'avancement est visible.</p>';
    S.avancement.forEach(function (a) {
      h += '<div class="listline">' + avatarHtml(a.nom_affiche, a.photo_url, false)
        + '<div class="grow"><b>' + esc(a.nom_affiche) + '</b>' + (a.fige ? ' <span class="badge gold">' + icon("award") + ' scellé</span>' : "")
        + '<div class="small muted">équipe ' + a.nb_top15 + '/15 · finalistes ' + a.nb_top5 + '/5 · rangs ' + a.nb_ordre + '/5 · essais ' + a.nb_essais + '/2</div></div></div>';
    });
    h += '</div>';
  }
  return h;
}

// ----- Résultat (mes points) -----
function viewResultat() {
  var ph = S.config.phase;
  if (ph !== "cloture" && ph !== "resultats") {
    return '<h2>Résultat</h2><div class="card center muted">Patience… Cette page s\'allumera le soir de l\'élection, quand les résultats commenceront à tomber. 📺</div>';
  }
  var cfg = S.config;
  var byId = {};
  S.candidates.forEach(function (x) { byId[x.id] = x; });

  var mine15 = [], mine5 = [], essais = [null, null, null];
  Object.keys(S.mine).forEach(function (k) {
    var p = S.mine[k], x = byId[k];
    if (!x) return;
    if (p.statut === "top15") mine15.push([x, p]);
    if (p.top5) mine5.push([x, p]);
    if (p.essai === 1) essais[1] = [x, p];
    if (p.essai === 2) essais[2] = [x, p];
  });
  var triNom = function (a, b) { return a[0].nom.localeCompare(b[0].nom); };
  mine5.sort(triNom);
  mine15.sort(triNom);

  var pts15 = 0, pts5 = 0, ptsOrd = 0, ptsE1 = 0, ptsE2 = 0;

  function mini(x, ok, sub) {
    return '<div class="listline"><span class="avatar">' + missPhoto(x) + '</span>'
      + '<div class="grow"><b style="color:var(--pink)">' + esc(x.nom) + '</b><div class="small muted">Miss ' + esc(x.region) + (sub ? " · " + sub : "") + '</div></div>'
      + '<span class="badge ' + (ok ? "ok" : "bad") + '">' + (ok ? "Bravo !" : "Dommage !") + '</span></div>';
  }

  var h15 = mine15.map(function (e) {
    var ok = e[0].dans_top15;
    if (ok) pts15 += cfg.pts_top15;
    return mini(e[0], ok);
  }).join("");
  var h5 = mine5.map(function (e) {
    var ok = e[0].est_finaliste;
    if (ok) pts5 += cfg.pts_top5;
    return mini(e[0], ok);
  }).join("");
  var ranked = [];
  Object.keys(S.mine).forEach(function (k) {
    var p = S.mine[k], x = byId[k];
    if (x && p.rang) ranked.push([x, p]);
  });
  ranked.sort(function (a, b) { return a[1].rang - b[1].rang; });
  var hOrd = ranked.map(function (e) {
    var ok = e[1].rang === e[0].rang_final;
    if (ok) ptsOrd += cfg.pts_ordre;
    var sub = "mon rang : Nº" + e[1].rang + " · réel : " + (e[0].rang_final ? "Nº" + e[0].rang_final : "à venir…");
    return mini(e[0], ok, sub);
  }).join("");
  var hE = [1, 2].map(function (n) {
    var e = essais[n];
    if (!e) return '<p class="muted small">Essai ' + n + ' : — non joué —</p>';
    var ok = e[0].rang_final === 1;
    if (ok) { if (n === 1) ptsE1 = cfg.pts_essai1; else ptsE2 = cfg.pts_essai2; }
    return '<h3>Essai ' + n + ' <span class="small muted">(' + (n === 1 ? cfg.pts_essai1 : cfg.pts_essai2) + ' pts si trouvée)</span></h3>' + mini(e[0], ok);
  }).join("");

  var qcm = Number(S.profil.points_qcm) || 0;
  var total = pts15 + pts5 + ptsOrd + ptsE1 + ptsE2 + qcm;

  var h = '<h2>Mon résultat</h2>';
  if (ph === "cloture") h += '<p class="small muted">🔴 En direct : les points se mettent à jour au fil des annonces (la page se rafraîchit toute seule).</p>';
  h += '<div class="card center"><span class="eyebrow">Total général</span><h1 style="font-size:2.6rem;margin:0.1rem">' + total + ' pts</h1>'
    + '<p class="small muted">15 Miss : <b>' + pts15 + '</b> · 5 Miss : <b>' + pts5 + '</b> · Bon ordre : <b>' + ptsOrd + '</b> · Essais : <b>' + (ptsE1 + ptsE2) + '</b> · QCM : <b>' + qcm + '</b></p></div>';

  h += '<div class="card"><h3>15 Miss sélectionnées <span class="small muted">(' + cfg.pts_top15 + ' pts par Miss trouvée)</span> — <span class="cnt">' + pts15 + ' pts</span></h3>' + (h15 || '<p class="muted small">Aucune sélection.</p>') + '</div>';
  h += '<div class="card"><h3>5 Miss sélectionnées <span class="small muted">(' + cfg.pts_top5 + ' pts par Miss trouvée)</span> — <span class="cnt">' + pts5 + ' pts</span></h3>' + (h5 || '<p class="muted small">Aucune finaliste.</p>') + '</div>';
  h += '<div class="card"><h3>Les 5 finalistes dans le bon ordre <span class="small muted">(' + cfg.pts_ordre + ' pts par bon rang)</span> — <span class="cnt">' + ptsOrd + ' pts</span></h3>' + (hOrd || '<p class="muted small">Aucun classement.</p>') + '</div>';
  h += '<div class="card"><h3>2 essais Miss France — <span class="cnt">' + (ptsE1 + ptsE2) + ' pts</span></h3>' + hE + '</div>';
  h += '<div class="card"><h3>QCM — <span class="cnt">' + qcm + ' pts</span></h3><p class="small muted">Notés à la main par le président du jury, décimales vexantes incluses.</p></div>';
  return h;
}

// ----- Benchmark -----
function viewBenchmark() {
  var h = '<h2>Benchmark</h2>';
  if (S.res === null) return h + '<div class="card center muted">Dépouillement en cours… 🗳️</div>';
  if (S.res.err) return h + '<div class="card center muted">' + esc(S.res.err) + '</div>';
  if (!S.res.length) return h + '<div class="card center muted">Aucun joueur.</div>';

  var rows = S.res.map(function (j) {
    var total = Number(j.pts_qcm) + j.pts_15 + j.pts_5 + j.pts_ordre + j.pts_essai1 + j.pts_essai2;
    return Object.assign({}, j, { total: total });
  });
  rows.sort(function (a, b) { return b.total - a.total; });

  function chart(title, key) {
    var max = 0;
    rows.forEach(function (r) { max = Math.max(max, Number(r[key])); });
    var hh = '<div class="card"><h3>' + title + '</h3>';
    rows.slice().sort(function (a, b) { return Number(b[key]) - Number(a[key]); }).forEach(function (r) {
      var v = Number(r[key]);
      var w = max ? Math.max(2, Math.round(v / max * 100)) : 2;
      var me = S.profil && r.pseudo === S.profil.pseudo;
      hh += '<div class="bar' + (me ? " me" : "") + '"><div class="top"><span class="lbl">' + esc(r.nom_affiche) + '</span>'
        + '<span class="val">' + v + '</span></div>'
        + '<span class="track"><span class="fill" style="width:' + w + '%"></span></span></div>';
    });
    return hh + "</div>";
  }

  h += chart("Classement général", "total");
  h += chart("QCM", "pts_qcm");
  h += chart("Choix des 15 Miss", "pts_15");
  h += chart("Choix des 5 Miss", "pts_5");
  h += chart("Les 5 dans l'ordre", "pts_ordre");
  h += chart("Essai Miss France Nº1", "pts_essai1");
  h += chart("Essai Miss France Nº2", "pts_essai2");

  h += '<h2>Le podium des jurés</h2>';
  rows.forEach(function (r, i) {
    var rank = '<span class="rank r' + (i + 1) + '">' + (i + 1) + '</span>';
    h += '<div class="card"><div class="row">' + rank + avatarHtml(r.nom_affiche, r.photo_url, false)
      + '<div style="flex:1"><b style="font-size:1.05rem">' + esc(r.nom_affiche) + '</b>'
      + '<div class="small muted">QCM ' + r.pts_qcm + ' · 15 Miss ' + r.pts_15 + ' · 5 Miss ' + r.pts_5 + ' · Ordre ' + r.pts_ordre + ' · Essais ' + (r.pts_essai1 + r.pts_essai2) + '</div></div>'
      + '<div class="cnt" style="font-size:1.4rem">' + r.total + ' pts</div></div></div>';
  });
  return h;
}

// ----- Admin -----
function viewAdmin() {
  if (!S.profil.est_admin) return "";
  var cfg = S.config;
  var h = '<h2>🎛️ La régie de l\'organisateur</h2>';

  h += '<div class="card"><h3>Phase du jeu</h3><p class="small muted">Change la phase pour faire avancer tout le monde en même temps.</p>'
    + '<select class="inp" onchange="App.aPhase(this)">';
  Object.keys(PHASES).forEach(function (k) {
    h += '<option value="' + k + '"' + (cfg.phase === k ? " selected" : "") + '>' + PHASES[k].label + '</option>';
  });
  h += '</select></div>';

  var nbEdits = Object.keys(S.admEdits || {}).length;
  var saveBtn = btn("App.aResultatsAll()", "Enregistrer toute la liste" + (nbEdits ? " (" + nbEdits + " modif.)" : ""), (nbEdits ? "gold" : "") + " adm-save");
  h += '<div class="card"><h3>Résultats réels des Miss</h3>'
    + '<p class="small muted">Le soir de l\'élection : coche « Top 15 » au fil des annonces, puis « Finaliste » pour les 5 du top 5 officiel, et enfin les rangs 1 à 5. Un seul clic sur « Enregistrer » applique tout et recalcule les scores. Côté joueurs, la galerie se filtre automatiquement : seules les Miss encore en course restent affichées.</p>';
  if (!S.candidates.length) {
    h += '<p class="muted small">Aucune candidate — ajoute-les dans Supabase (Table Editor → mf_candidates).</p>';
  } else {
    var edits = S.admEdits || {};
    function val(x) {
      var ed = edits[x.id];
      return {
        t15: ed ? ed.t15 : x.dans_top15,
        fin: ed ? ed.fin : x.est_finaliste,
        rang: ed ? ed.rang : x.rang_final,
        modif: !!ed
      };
    }
    var nT15 = 0, nFin = 0;
    S.candidates.forEach(function (x) { var v = val(x); if (v.t15) nT15++; if (v.fin) nFin++; });

    h += '<div class="center" style="margin-bottom:0.6rem">' + saveBtn + '</div>'
      + '<p class="center small" style="margin:0 0 0.5rem">Top 15 : <span class="cnt">' + nT15 + '/15</span> · Finalistes : <span class="cnt">' + nFin + '/5</span></p>'
      + '<input id="adm-search" class="search" placeholder="Filtrer par nom ou région…" value="' + esc(S.admQ || "") + '" oninput="App.admSearch(this)">';

    var aq = (S.admQ || "").trim().toLowerCase();
    var alist = S.candidates.filter(function (x) {
      return !aq || (x.nom + " " + x.region).toLowerCase().indexOf(aq) >= 0;
    });
    if (!alist.length) h += '<p class="muted small center">Aucune Miss ne correspond à cette recherche.</p>';
    h += '<div style="overflow-x:auto"><table class="adm"><thead><tr><th>Miss</th><th>Top 15</th><th>Finaliste</th><th>Rang final</th></tr></thead><tbody>';
    alist.forEach(function (x) {
      var v = val(x);
      h += '<tr' + (v.modif ? ' style="background:var(--pink-soft)"' : "") + '><td style="white-space:nowrap"><b>' + esc(x.nom) + '</b> <span class="small muted">· ' + esc(x.region) + '</span></td>'
        + '<td><input type="checkbox" id="adm-t15-' + x.id + '"' + (v.t15 ? " checked" : "") + ' onchange="App.admEdit(' + x.id + ')"></td>'
        + '<td><input type="checkbox" id="adm-fin-' + x.id + '"' + (v.fin ? " checked" : "") + ' onchange="App.admEdit(' + x.id + ')"></td>'
        + '<td><select class="inp" id="adm-rang-' + x.id + '" onchange="App.admEdit(' + x.id + ')"><option value="">—</option>';
      for (var i = 1; i <= 5; i++) h += '<option value="' + i + '"' + (v.rang === i ? " selected" : "") + '>Nº' + i + '</option>';
      h += '</select></td></tr>';
    });
    h += '</tbody></table></div>'
      + '<div class="center" style="margin-top:0.8rem">' + saveBtn + '</div>';
  }
  h += '</div>';

  h += '<div class="card"><h3>Joueurs : PIN &amp; points QCM</h3>';
  if (!S.admJoueurs) {
    h += '<p class="muted small">Chargement…</p>';
  } else {
    h += '<div style="overflow-x:auto"><table class="adm"><thead><tr><th>Joueur</th><th>PIN</th><th>Points QCM</th><th></th></tr></thead><tbody>';
    S.admJoueurs.forEach(function (j) {
      h += '<tr><td style="white-space:nowrap"><b>' + esc(j.nom_affiche) + '</b>' + (j.est_admin ? ' <span class="badge gold">régie</span>' : "") + '</td>'
        + '<td><span class="badge dark">' + esc(j.pin) + '</span></td>'
        + '<td><input class="inp" style="width:5rem" type="number" step="0.1" id="adm-qcm-' + j.id + '" value="' + esc(j.points_qcm) + '"></td>'
        + '<td>' + btn("App.aQcm(" + j.id + ")", "💾", "mini") + '</td></tr>';
    });
    h += '</tbody></table></div><p class="small muted">Pour changer un PIN ou une photo : Supabase → Table Editor → mf_joueurs.</p>';
  }
  h += '</div>';

  h += '<div class="card"><h3>' + icon("trash") + ' Zone dangereuse</h3>'
    + '<p class="small muted">Repartir de zéro pour une nouvelle partie : efface tous les pronostics et dossiers scellés de tous les joueurs, remet à zéro les résultats réels et les points QCM, et repasse le jeu en « Préparation du casting ». Les joueurs (PIN, photos) et les fiches des candidates sont conservés.</p>'
    + '<div class="center">' + btn("App.aReset()", "Réinitialiser le jeu", "dark") + '</div></div>';
  return h;
}

// ----- Fiche candidate (modale) -----
function viewFiche() {
  if (S.fiche == null) return "";
  var x = S.candidates.find(function (c) { return c.id === S.fiche; });
  if (!x) return "";
  var p = S.mine[x.id];
  var h = '<div class="modal-bg" onclick="if(event.target===this)App.closeFiche()"><div class="modal">'
    + '<button class="close" onclick="App.closeFiche()" aria-label="Fermer">✕</button>'
    + '<div class="bigph">' + missPhoto(x, S.ficheSurprise) + '</div>';
  if (x.photo_surprise_url) h += '<p class="center" style="margin:0 0 0.5rem">' + btn("App.surprise()", S.ficheSurprise ? "Remettre la vraie photo" : icon("spark") + " Surprise", "mini") + '</p>';
  h += '<h2 class="center" style="margin:0.2rem 0 0">' + esc(x.nom) + '</h2>'
    + '<p class="center" style="color:var(--pink);font-weight:700;margin:0.1rem 0 0.6rem">Miss ' + esc(x.region) + '</p>'
    + '<ul class="small" style="color:var(--text)">'
    + (x.age ? "<li>" + esc(x.age) + " ans</li>" : "")
    + (x.taille ? "<li>" + esc(x.taille) + "</li>" : "")
    + (x.profession ? "<li>" + esc(x.profession) + "</li>" : "")
    + '</ul><div class="center">' + finalisteBadge(x) + statutBadge(p) + '</div>'
    + '<div class="center" style="margin-top:0.6rem">' + missActions(x) + '</div>'
    + '</div></div>';
  return h;
}

// ------------------------------------------------------------------
// Rafraîchissement automatique pendant la soirée
// ------------------------------------------------------------------
setInterval(function () {
  if (!S.session || !S.config) return;
  var ph = S.config.phase;
  var focused = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (focused || S.fiche != null) return;
  if (ph === "cloture" || ph === "resultats") {
    Promise.all([loadConfig(), loadCandidates(), loadProfil()]).then(function () {
      if (S.tab === "benchmark") loadBenchmark(); else render();
    }).catch(function () {});
  } else {
    var avant = S.config.phase + "|" + (S.profil && S.profil.fige);
    Promise.all([loadConfig(), loadProfil()]).then(function () {
      var apres = S.config.phase + "|" + (S.profil && S.profil.fige);
      if (apres !== avant) render();
    }).catch(function () {});
  }
}, 45000);

boot();
</script>
</body>
</html>
