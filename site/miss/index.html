<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miss France 2027 — Les Pronostics</title>
<style>
  :root {
    --paper: #fff6fa;
    --card: #ffffff;
    --ink: #27275c;
    --text: #4a4560;
    --muted: #8b84a0;
    --line: #f0d9e6;
    --pink: #d63384;
    --pink-soft: #fce3f0;
    --dark: #4b4a57;
    --gold: #b98f1f;
    --ok: #2e7d5b;
    --ok-soft: #e2f2ea;
    --bad: #c0392b;
    --bad-soft: #fbe9e6;
    --shadow: 0 10px 30px rgba(214, 51, 132, 0.09);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 1.5rem 1rem 5rem; }
  h1, h2, h3 { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; color: var(--ink); line-height: 1.2; }
  h1 { font-size: 1.7rem; margin: 0.3rem 0; text-wrap: balance; }
  h2 { font-size: 1.35rem; margin: 2rem 0 0.3rem; text-decoration: underline; text-decoration-color: var(--pink); text-underline-offset: 5px; }
  h3 { font-size: 1.05rem; margin: 1rem 0 0.4rem; }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.7rem; font-weight: 700; color: var(--pink); }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }
  .center { text-align: center; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 1.1rem 1.2rem; margin-bottom: 0.9rem;
  }

  button, select, input {
    font: inherit;
  }
  .btn {
    display: inline-block; border: 1px solid transparent; border-radius: 999px;
    padding: 0.42rem 0.9rem; cursor: pointer; font-weight: 600; font-size: 0.85rem;
    background: var(--pink); color: #fff; transition: filter 0.15s; margin: 0.15rem 0.2rem 0.15rem 0;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  .btn.dark { background: var(--dark); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.gold { background: var(--gold); }
  .btn.mini { padding: 0.25rem 0.6rem; font-size: 0.78rem; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

  .badge {
    display: inline-block; border-radius: 999px; padding: 0.18rem 0.65rem;
    font-size: 0.75rem; font-weight: 700; margin: 0.1rem 0.2rem 0.1rem 0;
  }
  .badge.pink { background: var(--pink-soft); color: var(--pink); }
  .badge.dark { background: #e8e7ee; color: var(--dark); }
  .badge.gold { background: #f7edd2; color: var(--gold); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }

  nav.tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin: 1.1rem 0; }
  nav.tabs button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 0.45rem 1rem; cursor: pointer; font-weight: 600; font-size: 0.88rem;
  }
  nav.tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .phasebar {
    background: var(--pink-soft); border: 1px solid var(--line); border-radius: 12px;
    padding: 0.7rem 1rem; margin-bottom: 1.2rem; text-align: center;
  }
  .phasebar b { color: var(--pink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(225px, 1fr)); gap: 0.9rem; }
  .miss {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
  }
  .miss.selected { border-color: var(--pink); }
  .miss .ph {
    aspect-ratio: 3 / 4; background: linear-gradient(160deg, #fce3f0, #f6d3e6);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 3rem; color: #e5a9c8; overflow: hidden;
  }
  .miss .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .miss .body { padding: 0.7rem 0.8rem 0.85rem; display: flex; flex-direction: column; gap: 0.15rem; flex: 1; }
  .miss .nom { font-weight: 700; color: var(--pink); cursor: pointer; }
  .miss .meta { font-size: 0.83rem; color: var(--muted); }
  .miss .actions { margin-top: auto; padding-top: 0.5rem; }
  .miss .actions .btn { display: block; width: 100%; margin: 0.3rem 0 0; text-align: center; }

  .avatar {
    width: 3.2rem; height: 3.2rem; border-radius: 50%; object-fit: cover;
    background: var(--pink-soft); color: var(--pink); display: inline-flex;
    align-items: center; justify-content: center; font-weight: 700; overflow: hidden; flex: none;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.big { width: 6.2rem; height: 6.2rem; font-size: 1.6rem; border: 3px solid var(--pink-soft); }

  .logingrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.8rem; }
  .logingrid button {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 0.9rem 0.5rem; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: 0.5rem; box-shadow: var(--shadow);
  }
  .logingrid button:hover { border-color: var(--pink); }
  .logingrid .nom { font-size: 0.82rem; font-weight: 600; color: var(--ink); }

  .pin {
    font-size: 1.6rem; letter-spacing: 0.8rem; text-align: center; width: 11rem;
    border: 1px solid var(--line); border-radius: 12px; padding: 0.5rem 0 0.5rem 0.8rem;
    background: var(--card); color: var(--ink);
  }
  .pin:focus { outline: 2px solid var(--pink); }

  .row { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
  .listline {
    display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0;
    border-bottom: 1px solid var(--line);
  }
  .listline:last-child { border-bottom: none; }
  .listline .grow { flex: 1; min-width: 0; }

  .bar { display: flex; align-items: center; gap: 0.6rem; margin: 0.3rem 0; }
  .bar .lbl { flex: 0 0 9.5rem; font-size: 0.8rem; text-align: right; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .track { flex: 1; background: #f6ecf2; border-radius: 999px; height: 1.05rem; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--pink); border-radius: 999px; min-width: 2px; transition: width 0.4s; }
  .bar.me .fill { background: var(--gold); }
  .bar .val { flex: 0 0 2.6rem; font-size: 0.8rem; font-weight: 700; color: var(--ink); }

  .search {
    width: 100%; border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    padding: 0.55rem 1rem; margin-bottom: 1rem; color: var(--ink);
  }
  .search:focus { outline: 2px solid var(--pink); }

  select.inp, input.inp {
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    padding: 0.3rem 0.45rem; color: var(--ink);
  }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(39, 39, 92, 0.55); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  .modal {
    background: var(--card); border-radius: 16px; max-width: 420px; width: 100%;
    max-height: 92vh; overflow-y: auto; padding: 1.1rem 1.2rem 1.3rem; position: relative;
  }
  .modal .close {
    position: absolute; top: 0.6rem; right: 0.7rem; border: none; background: var(--pink-soft);
    color: var(--pink); border-radius: 50%; width: 2rem; height: 2rem; cursor: pointer; font-weight: 700;
  }
  .modal .bigph {
    border-radius: 12px; overflow: hidden; background: var(--pink-soft);
    aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center;
    font-size: 4rem; color: #e5a9c8; margin-bottom: 0.7rem;
  }
  .modal .bigph img { width: 100%; height: 100%; object-fit: cover; }

  #toast {
    position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; border-radius: 999px; padding: 0.6rem 1.2rem;
    font-size: 0.9rem; z-index: 100; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    max-width: 92vw; text-align: center; display: none;
  }
  #toast.err { background: var(--bad); }

  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 2.5rem; }
  .cnt { font-weight: 700; color: var(--gold); }
  table.adm { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.adm th, table.adm td { text-align: left; padding: 0.45rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.adm th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap"><div id="app" class="center muted" style="padding-top:4rem">Chargement du tapis rouge…</div></div>
<div id="toast"></div>

<script>
"use strict";

// ------------------------------------------------------------------
// Connexion à la base Supabase (clé « publishable » : faite pour être
// publiée ; toutes les écritures sont contrôlées côté serveur).
// ------------------------------------------------------------------
var SUPABASE = {
  url: "https://vqzvwihmyzjnoqnqrtsv.supabase.co",
  anonKey: "sb_publishable_7r4EbkKj3F5yLdgAUZn28w_EWwZZBCo"
};

var STORE_KEY = "mf2027-session";

var PHASES = {
  preparation: { label: "Préparation du casting", desc: "Le tapis rouge se déroule, les paillettes se comptent… Le jeu n'est pas encore ouvert." },
  selection15: { label: "Sélection des 15", desc: "Compose ta liste de <b>15 Miss</b> — et gare ton indécision au <b>ballotage</b> (illimité)." },
  top5:        { label: "Choix des 5 finalistes", desc: "Parmi tes 15, choisis tes <b>5 finalistes</b>." },
  ordre:       { label: "L'ordre final", desc: "Classe tes 5 finalistes de la <b>1<sup>re</sup></b> (Miss France) à la <b>5<sup>e</sup></b> place." },
  essais:      { label: "Essais Miss France", desc: "Tes <b>2 essais</b> pour la couronne : essai 1 (gros lot) et essai 2 (filet de secours)." },
  cloture:     { label: "Élection en direct !", desc: "Pronostics verrouillés chez l'huissier. Les points tombent en direct — onglet <b>Résultat</b> !" },
  resultats:   { label: "Résultats officiels", desc: "Tout est publié : tes points dans <b>Résultat</b>, la confrontation générale dans <b>Benchmark</b>." }
};

var S = {
  session: null,      // { jeton, pseudo }
  profil: null,       // { nom_affiche, photo_url, est_admin, points_qcm }
  config: null,
  candidates: [],
  joueurs: [],
  mine: {},           // candidate_id -> { statut, rang, essai }
  tab: "accueil",
  q: "",
  loginSel: null,
  fiche: null,
  ficheSurprise: false,
  avancement: null,
  res: null,
  admJoueurs: null
};

// ------------------------------------------------------------------
// API
// ------------------------------------------------------------------
function api(method, path, body) {
  return fetch(SUPABASE.url + path, {
    method: method,
    headers: { "Content-Type": "application/json", "apikey": SUPABASE.anonKey },
    body: body === undefined ? undefined : JSON.stringify(body)
  }).then(function (r) {
    if (r.status === 204) return null;
    return r.json().then(function (data) {
      if (!r.ok) {
        var msg = (data && (data.message || data.hint || data.error)) || ("Erreur " + r.status);
        throw new Error(msg);
      }
      return data;
    });
  });
}
function rpc(name, params) { return api("POST", "/rest/v1/rpc/" + name, params || {}); }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

var toastTimer = null;
function toast(msg, isErr) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = isErr ? "err" : "";
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = "none"; }, 3200);
}

// ------------------------------------------------------------------
// Chargement des données
// ------------------------------------------------------------------
function loadConfig() {
  return api("GET", "/rest/v1/mf_config?id=eq.1&select=*").then(function (r) { S.config = r[0]; });
}
function loadCandidates() {
  return api("GET", "/rest/v1/mf_candidates?select=*&order=region.asc").then(function (r) { S.candidates = r; });
}
function loadJoueurs() {
  return api("GET", "/rest/v1/mf_joueurs_public?select=*&order=nom_affiche.asc").then(function (r) { S.joueurs = r; });
}
function loadMine() {
  if (!S.session) return Promise.resolve();
  return rpc("mf_mes_pronostics", { p_jeton: S.session.jeton }).then(function (rows) {
    S.mine = {};
    rows.forEach(function (p) { S.mine[p.candidate_id] = p; });
  });
}
function loadProfil() {
  if (!S.session) return Promise.resolve();
  return rpc("mf_mon_profil", { p_jeton: S.session.jeton }).then(function (rows) {
    if (!rows || !rows.length) throw new Error("session périmée");
    S.profil = rows[0];
  });
}

function boot() {
  try { S.session = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) {}
  Promise.all([loadConfig(), loadCandidates(), loadJoueurs()])
    .then(function () {
      if (!S.session) return;
      return Promise.all([loadProfil(), loadMine()]).catch(function () { logout(false); });
    })
    .then(render)
    .catch(function (e) {
      document.getElementById("app").innerHTML =
        '<div class="card center">😢 Impossible de joindre la base du concours.<br><span class="small muted">' +
        esc(e.message) + '</span><br><br><button class="btn" onclick="location.reload()">Réessayer</button></div>';
    });
}

function logout(re) {
  S.session = null; S.profil = null; S.mine = {}; S.tab = "accueil";
  localStorage.removeItem(STORE_KEY);
  if (re !== false) render();
}

// ------------------------------------------------------------------
// Actions joueur
// ------------------------------------------------------------------
function refresh(alsoCand) {
  var jobs = [loadMine()];
  if (alsoCand) jobs.push(loadCandidates(), loadConfig());
  return Promise.all(jobs).then(render);
}

window.App = {
  goTab: function (t) {
    S.tab = t; S.res = null; S.avancement = null; S.admJoueurs = null;
    render();
    if (t === "benchmark") loadBenchmark();
    if (t === "selection") loadAvancement();
    if (t === "admin") loadAdmin();
  },
  pickJoueur: function (id) {
    S.loginSel = S.joueurs.find(function (j) { return j.id === id; }) || null;
    render();
    var el = document.getElementById("pin-input");
    if (el) el.focus();
  },
  backLogin: function () { S.loginSel = null; render(); },
  tryPin: function (ev) {
    if (ev) ev.preventDefault();
    var el = document.getElementById("pin-input");
    var pin = (el && el.value || "").trim();
    if (!/^[0-9]{4}$/.test(pin)) { toast("Le PIN, c'est 4 chiffres !", true); return false; }
    rpc("mf_connexion", { p_pseudo: S.loginSel.pseudo, p_pin: pin })
      .then(function (rows) {
        if (!rows || !rows.length) { toast("PIN incorrect… L'huissier te surveille. 👀", true); return; }
        S.session = { jeton: rows[0].jeton, pseudo: S.loginSel.pseudo };
        localStorage.setItem(STORE_KEY, JSON.stringify(S.session));
        S.loginSel = null;
        return Promise.all([loadProfil(), loadMine()]).then(render);
      })
      .catch(function (e) { toast(e.message, true); });
    return false;
  },
  logout: function () { logout(); },

  statut: function (cid, st) {
    rpc("mf_definir_statut", { p_jeton: S.session.jeton, p_candidate: cid, p_statut: st })
      .then(function () { return refresh(); })
      .catch(function (e) { toast(e.message, true); });
  },
  rang: function (cid, sel) {
    var v = sel.value === "" ? null : parseInt(sel.value, 10);
    rpc("mf_definir_rang", { p_jeton: S.session.jeton, p_candidate: cid, p_rang: v })
      .then(function () { return refresh(); })
      .catch(function (e) { toast(e.message, true); refresh(); });
  },
  essai: function (essai, cid) {
    rpc("mf_definir_essai", { p_jeton: S.session.jeton, p_essai: essai, p_candidate: cid })
      .then(function () { return refresh(); })
      .catch(function (e) { toast(e.message, true); });
  },

  search: function (inp) { S.q = inp.value; renderKeepFocus(inp); },
  fiche: function (cid) { S.fiche = cid; S.ficheSurprise = false; render(); },
  closeFiche: function () { S.fiche = null; render(); },
  surprise: function () { S.ficheSurprise = !S.ficheSurprise; render(); },

  figer: function () {
    rpc("mf_figer", { p_jeton: S.session.jeton })
      .then(function () {
        toast("Dossier scellé chez l'huissier de justice ! ⚖️");
        return Promise.all([loadProfil(), loadMine()]).then(render);
      })
      .catch(function (e) { toast(e.message, true); });
  },
  defiger: function () {
    rpc("mf_defiger", { p_jeton: S.session.jeton })
      .then(function () {
        toast("Dossier récupéré — tu peux modifier à nouveau.");
        return Promise.all([loadProfil(), loadMine()]).then(render);
      })
      .catch(function (e) { toast(e.message, true); });
  },

  // ----- admin -----
  aPhase: function (sel) {
    rpc("mf_admin_phase", { p_jeton: S.session.jeton, p_phase: sel.value })
      .then(function () { toast("Phase changée : " + PHASES[sel.value].label); return refresh(true); })
      .catch(function (e) { toast(e.message, true); });
  },
  aResultat: function (cid) {
    var chk = document.getElementById("adm-t15-" + cid);
    var sel = document.getElementById("adm-rang-" + cid);
    var rang = sel.value === "" ? null : parseInt(sel.value, 10);
    rpc("mf_admin_resultat", { p_jeton: S.session.jeton, p_candidate: cid, p_dans_top15: chk.checked, p_rang: rang })
      .then(function () { toast("Résultat enregistré ✓"); return loadCandidates().then(render); })
      .catch(function (e) { toast(e.message, true); });
  },
  aQcm: function (jid) {
    var v = parseFloat(document.getElementById("adm-qcm-" + jid).value || "0");
    rpc("mf_admin_qcm", { p_jeton: S.session.jeton, p_joueur: jid, p_points: isNaN(v) ? 0 : v })
      .then(function () { toast("Points QCM enregistrés ✓"); return loadAdmin(); })
      .catch(function (e) { toast(e.message, true); });
  }
};

function loadAvancement() {
  rpc("mf_avancement", {}).then(function (r) { S.avancement = r; render(); }).catch(function () {});
}
function loadBenchmark() {
  rpc("mf_resultats", { p_jeton: S.session.jeton })
    .then(function (r) { S.res = r || []; render(); })
    .catch(function (e) { S.res = { err: e.message }; render(); });
}
function loadAdmin() {
  if (!S.profil || !S.profil.est_admin) return;
  rpc("mf_admin_joueurs", { p_jeton: S.session.jeton })
    .then(function (r) { S.admJoueurs = r; render(); })
    .catch(function (e) { toast(e.message, true); });
}

// ------------------------------------------------------------------
// Rendu
// ------------------------------------------------------------------
function avatarHtml(nom, url, big) {
  var cls = "avatar" + (big ? " big" : "");
  if (url) return '<span class="' + cls + '"><img src="' + esc(url) + '" alt=""></span>';
  var initials = nom.replace(/^(Mister|Miss)\s+/i, "").split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
  return '<span class="' + cls + '">' + esc(initials || "?") + '</span>';
}

function missPhoto(c, surprise) {
  var url = surprise && c.photo_surprise_url ? c.photo_surprise_url : c.photo_url;
  return url ? '<img src="' + esc(url) + '" alt="' + esc(c.nom) + '" loading="lazy">' : "👑";
}

function statutBadge(p) {
  if (!p) return "";
  var h = "";
  if (p.statut === "top5") h += '<span class="badge gold">⭐ Finaliste' + (p.rang ? " — Nº" + p.rang : "") + '</span>';
  else if (p.statut === "top15") h += '<span class="badge pink">✓ Dans mon équipe</span>';
  else if (p.statut === "ballotage") h += '<span class="badge dark">⏳ En ballotage</span>';
  if (p.essai === 1) h += '<span class="badge gold">👑 Essai 1</span>';
  if (p.essai === 2) h += '<span class="badge gold">👑 Essai 2</span>';
  return h;
}

function missActions(c) {
  if (S.profil && S.profil.fige) return "";
  var p = S.mine[c.id];
  var ph = S.config.phase;
  var st = p ? p.statut : null;
  var h = "";
  if (ph === "selection15") {
    if (st === "top15") h += btn("App.statut(" + c.id + ",'aucun')", "Retirer de mon équipe", "ghost mini");
    else h += btn("App.statut(" + c.id + ",'top15')", "Je la veux dans mon équipe !", "mini");
    if (st === "ballotage") h += btn("App.statut(" + c.id + ",'aucun')", "Sortir du ballotage", "ghost mini");
    else if (st !== "top15") h += btn("App.statut(" + c.id + ",'ballotage')", "Bof ! Mais à revoir plus tard", "dark mini");
  } else if (ph === "top5") {
    if (st === "top15") h += btn("App.statut(" + c.id + ",'top5')", "⭐ Dans mes 5 finalistes !", "mini");
    else if (st === "top5") h += btn("App.statut(" + c.id + ",'top15')", "Redescendre dans les 15", "ghost mini");
  } else if (ph === "ordre") {
    if (st === "top5") h += rangSelect(c.id, p && p.rang);
  } else if (ph === "essais") {
    var e = p ? p.essai : null;
    h += e === 1 ? btn("App.essai(1,null)", "Annuler l'essai 1", "ghost mini") : btn("App.essai(1," + c.id + ")", "👑 Essai 1", "gold mini");
    h += e === 2 ? btn("App.essai(2,null)", "Annuler l'essai 2", "ghost mini") : btn("App.essai(2," + c.id + ")", "Essai 2", "dark mini");
  }
  return h;
}

function btn(onclick, label, cls) {
  label = label.replace(/ !/g, "&nbsp;!");
  return '<button class="btn ' + (cls || "") + '" onclick="' + onclick + '">' + label + '</button>';
}

function rangSelect(cid, cur) {
  var h = '<label class="small muted">Place finale : </label><select class="inp" onchange="App.rang(' + cid + ', this)">';
  h += '<option value=""' + (cur ? "" : " selected") + '>—</option>';
  for (var i = 1; i <= 5; i++) {
    h += '<option value="' + i + '"' + (cur === i ? " selected" : "") + '>Nº' + i + (i === 1 ? " (Miss France)" : "") + '</option>';
  }
  return h + "</select>";
}

function renderKeepFocus(inp) {
  var pos = inp.selectionStart;
  render();
  var el = document.getElementById("search-input");
  if (el) { el.focus(); el.setSelectionRange(pos, pos); }
}

function render() {
  var app = document.getElementById("app");
  if (!S.config) { app.innerHTML = '<div class="card center">Base non initialisée : exécute <code>miss-france.sql</code> dans Supabase.</div>'; return; }
  if (!S.session || !S.profil) { app.innerHTML = viewLogin(); return; }

  var html = viewHeader();
  if (S.tab === "accueil") html += viewAccueil();
  else if (S.tab === "selection") html += viewSelection();
  else if (S.tab === "resultat") html += viewResultat();
  else if (S.tab === "benchmark") html += viewBenchmark();
  else if (S.tab === "admin") html += viewAdmin();
  html += '<footer>Concours privé entre ami·e·s · Aucune Miss n\'a été blessée pendant ces pronostics 👠</footer>';
  html += viewFiche();
  app.innerHTML = html;
}

// ----- Header commun -----
function viewHeader() {
  var ph = PHASES[S.config.phase] || { label: S.config.phase, desc: "" };
  var h = '<header class="center">'
    + avatarHtml(S.profil.nom_affiche, S.profil.photo_url, true)
    + '<h1>Bonsoir <span style="background:var(--pink-soft);padding:0 0.4rem;border-radius:6px">' + esc(S.profil.nom_affiche) + ' !</span></h1>'
    + '<p class="small muted" style="max-width:620px;margin:0.4rem auto">Bienvenue à l\'élection de Miss France, la soirée où les sourires sont figés, les talons vertigineux et les réponses… toujours pleines de surprises ! Alors, qui réussira à marcher droit, sourire grand et parler climat sans bafouiller ? /!\\ Spoiler /!\\ : Pas nous, mais on a le droit d\'y croire !</p>'
    + '</header>';

  var tabs = [["accueil", "🏠 Les Jeunettes"], ["selection", "📋 Ma sélection"], ["resultat", "🏆 Résultat"], ["benchmark", "📊 Benchmark"]];

  h += '<nav class="tabs">';
  tabs.forEach(function (t) {

  });

function myCounts() {
  var t15 = 0, t5 = 0, ranges = 0, e1 = false;
  Object.keys(S.mine).forEach(function (k) {
    var p = S.mine[k];
    if (p.statut === "top15" || p.statut === "top5") t15++;
    if (p.statut === "top5") { t5++; if (p.rang) ranges++; }
    if (p.essai === 1) e1 = true;
  });
  return { t15: t15, t5: t5, ranges: ranges, e1: e1 };
}

// Encadré « huissier de justice » : sceller / récupérer sa sélection.
function huissierCard() {
  var ph = S.config.phase;
  if (ph !== "selection15" && ph !== "top5" && ph !== "ordre" && ph !== "essais") return "";
  var c = myCounts();
  if (S.profil.fige) {
    return '<div class="card center" style="border-color:var(--gold)">'
      + '<span class="badge gold">⚖️ Dossier scellé chez l\'huissier de justice</span>'
      + '<p class="small muted" style="margin:0.5rem 0">Ta sélection est officielle — plus aucune modification possible.</p>'
      + btn("App.defiger()", "Récupérer mon dossier", "ghost mini") + '</div>';
  }
  var ready = false, hint = "";
  if (ph === "selection15") {
    ready = c.t15 === 15;
    hint = "Encore " + (15 - c.t15) + " Miss à recruter avant de pouvoir sceller.";
  } else if (ph === "top5") {
    ready = c.t5 === 5;
    hint = "Encore " + (5 - c.t5) + " finaliste(s) à choisir avant de pouvoir sceller.";
  } else if (ph === "ordre") {
    ready = c.ranges === 5;
    hint = "Encore " + (5 - c.ranges) + " rang(s) à attribuer avant de pouvoir sceller.";
  } else if (ph === "essais") {
    ready = c.e1;
    hint = "Choisis au moins ton essai 1 avant de pouvoir sceller.";
  }
  return '<div class="card center">'
    + (ready
      ? btn("App.figer()", "⚖️ Envoyer à l'huissier de justice !", "gold")
        + '<p class="small muted" style="margin:0.4rem 0 0">Sceller ta sélection la rend officielle (tu pourras récupérer ton dossier tant que la phase est ouverte).</p>'
      : '<p class="small muted" style="margin:0">⚖️ ' + hint + '</p>')
    + '</div>';
}

// ----- Accueil : galerie -----
function viewAccueil() {
  var c = myCounts();
  var h = '<h2>Les Jeunettes en lice :</h2>'

  var q = S.q.trim().toLowerCase();
  var list = S.candidates.filter(function (x) {
    return !q || (x.nom + " " + x.region).toLowerCase().indexOf(q) >= 0;
  });

  if (!S.candidates.length) {
    return h + '<div class="card center muted">Le casting n\'est pas encore arrivé… L\'organisateur prépare les fiches des candidates. 💅</div>';
  }
  if (!list.length) return h + '<div class="card center muted">Personne ne correspond à cette recherche.</div>';

  h += '<div class="grid">';
  list.forEach(function (x) {
    var p = S.mine[x.id];
    h += '<article class="miss' + (p && (p.statut === "top15" || p.statut === "top5") ? " selected" : "") + '">'
      + '<div class="ph" onclick="App.fiche(' + x.id + ')">' + missPhoto(x) + '</div>'
      + '<div class="body">'
      + '<span class="nom" onclick="App.fiche(' + x.id + ')">' + esc(x.nom) + '</span>'
      + '<span class="meta">Miss ' + esc(x.region) + (x.age ? " · " + esc(x.age) + " ans" : "") + '</span>'

      + '<div>' + statutBadge(p) + '</div>'
      + '<div class="actions">' + missActions(x) + '</div>'
      + '</div></article>';

}

// ----- Ma sélection -----
function viewSelection() {
  var byId = {};
  S.candidates.forEach(function (x) { byId[x.id] = x; });
  var top15 = [], top5 = [], ball = [], essais = [null, null, null];
  Object.keys(S.mine).forEach(function (k) {
    var p = S.mine[k], x = byId[k];
    if (!x) return;
    if (p.statut === "top15") top15.push([x, p]);
    if (p.statut === "top5") top5.push([x, p]);
    if (p.statut === "ballotage") ball.push([x, p]);
    if (p.essai === 1) essais[1] = [x, p];
    if (p.essai === 2) essais[2] = [x, p];
  });
  top5.sort(function (a, b) { return (a[1].rang || 9) - (b[1].rang || 9); });
  var sortNom = function (a, b) { return a[0].nom.localeCompare(b[0].nom); };
  top15.sort(sortNom); ball.sort(sortNom);
  var c = myCounts();

  function ligne(x, p, extra) {
    return '<div class="listline">'
      + '<span class="avatar" style="cursor:pointer" onclick="App.fiche(' + x.id + ')">' + missPhoto(x) + '</span>'
      + '<div class="grow"><b style="color:var(--pink);cursor:pointer" onclick="App.fiche(' + x.id + ')">' + esc(x.nom) + '</b>'
      + '<div class="small muted">Miss ' + esc(x.region) + '</div></div>'
      + '<div>' + (extra || "") + '</div></div>';
  }

  var h = '<h2>Ma sélection</h2>'
    + '<p class="small muted">Miss retenues : <span class="cnt">' + c.t15 + ' / 15</span> — brouillon enregistré automatiquement ; scelle-le chez l\'huissier pour le rendre officiel. 🖋️</p>'
    + huissierCard();

  h += '<div class="card"><h3>⭐ Mes 5 finalistes (' + c.t5 + '/5)</h3>';
  var locked = !!S.profil.fige;
  h += top5.length ? top5.map(function (e) {
    var extra = (S.config.phase === "ordre" && !locked) ? rangSelect(e[0].id, e[1].rang)
      : (e[1].rang ? '<span class="badge gold">Nº' + e[1].rang + '</span>' : "");
    if (S.config.phase === "top5" && !locked) extra += btn("App.statut(" + e[0].id + ",'top15')", "↩︎", "ghost mini");
    return ligne(e[0], e[1], extra);
  }).join("") : '<p class="muted small">Personne pour l\'instant…</p>';
  h += '</div>';

  h += '<div class="card"><h3>👑 Mes essais Miss France</h3>';
  [1, 2].forEach(function (n) {
    var e = essais[n];
    h += '<div class="listline"><span class="badge gold">Essai ' + n + '</span><div class="grow">'
      + (e ? '<b style="color:var(--pink)">' + esc(e[0].nom) + '</b> <span class="small muted">Miss ' + esc(e[0].region) + '</span>' : '<span class="muted small">— pas encore choisie —</span>')
      + '</div>' + (e && S.config.phase === "essais" && !locked ? btn("App.essai(" + n + ",null)", "Annuler", "ghost mini") : "") + '</div>';
  });
  h += '</div>';

  h += '<div class="card"><h3>💖 Mon équipe des 15 (' + c.t15 + '/15)</h3>';
  var equipe = top5.concat(top15);
  h += equipe.length ? equipe.map(function (e) {
    var extra = statutBadge(e[1]);
    if (!locked && S.config.phase === "selection15" && e[1].statut === "top15") extra += btn("App.statut(" + e[0].id + ",'aucun')", "🗑", "ghost mini");
    if (!locked && S.config.phase === "top5" && e[1].statut === "top15") extra += btn("App.statut(" + e[0].id + ",'top5')", "⭐", "mini");
    return ligne(e[0], e[1], extra);
  }).join("") : '<p class="muted small">Ton équipe est vide. Fonce à l\'Accueil recruter !</p>';
  h += '</div>';

  h += '<div class="card"><h3>⏳ Mes Miss en ballotage</h3>';
  h += ball.length ? ball.map(function (e) {
    var extra = "";
    if (S.config.phase === "selection15" && !locked) {
      extra = btn("App.statut(" + e[0].id + ",'top15')", "Je la veux !", "mini") + btn("App.statut(" + e[0].id + ",'aucun')", "🗑", "ghost mini");
    }
    return ligne(e[0], e[1], extra);
  }).join("") : '<p class="muted small">Le purgatoire est vide.</p>';
  h += '</div>';

  if (S.avancement) {
    h += '<div class="card"><h3>📡 Où en sont les autres ?</h3><p class="small muted">Leurs choix restent secrets — seul l\'avancement est visible.</p>';
    S.avancement.forEach(function (a) {
      h += '<div class="listline">' + avatarHtml(a.nom_affiche, a.photo_url, false)
        + '<div class="grow"><b>' + esc(a.nom_affiche) + '</b>' + (a.fige ? ' <span class="badge gold">⚖️ scellé</span>' : "") + '</div>'
        + '<span class="small muted">équipe ' + a.nb_top15 + '/15 · finalistes ' + a.nb_top5 + '/5 · rangs ' + a.nb_ordre + '/5 · essais ' + a.nb_essais + '/2</span></div>';
    });
    h += '</div>';
  }
  return h;
}

// ----- Résultat (mes points) -----
function viewResultat() {
  var ph = S.config.phase;
  if (ph !== "cloture" && ph !== "resultats") {
    return '<h2>Résultat</h2><div class="card center muted">Patience… Cette page s\'allumera le soir de l\'élection, quand les résultats commenceront à tomber. 📺</div>';
  }
  var cfg = S.config;
  var byId = {};
  S.candidates.forEach(function (x) { byId[x.id] = x; });

  var mine15 = [], mine5 = [], essais = [null, null, null];
  Object.keys(S.mine).forEach(function (k) {
    var p = S.mine[k], x = byId[k];
    if (!x) return;
    if (p.statut === "top15" || p.statut === "top5") mine15.push([x, p]);
    if (p.statut === "top5") mine5.push([x, p]);
    if (p.essai === 1) essais[1] = [x, p];
    if (p.essai === 2) essais[2] = [x, p];
  });
  mine5.sort(function (a, b) { return (a[1].rang || 9) - (b[1].rang || 9); });
  mine15.sort(function (a, b) { return a[0].nom.localeCompare(b[0].nom); });

  var pts15 = 0, pts5 = 0, ptsOrd = 0, ptsE1 = 0, ptsE2 = 0;

  function mini(x, ok, sub) {
    return '<div class="listline"><span class="avatar">' + missPhoto(x) + '</span>'
      + '<div class="grow"><b style="color:var(--pink)">' + esc(x.nom) + '</b><div class="small muted">Miss ' + esc(x.region) + (sub ? " · " + sub : "") + '</div></div>'
      + '<span class="badge ' + (ok ? "ok" : "bad") + '">' + (ok ? "Bravo !" : "Dommage !") + '</span></div>';
  }

  var h15 = mine15.map(function (e) {
    var ok = e[0].dans_top15;
    if (ok) pts15 += cfg.pts_top15;
    return mini(e[0], ok);
  }).join("");
  var h5 = mine5.map(function (e) {
    var ok = e[0].rang_final != null;
    if (ok) pts5 += cfg.pts_top5;
    return mini(e[0], ok);
  }).join("");
  var hOrd = mine5.map(function (e) {
    var ok = e[1].rang != null && e[1].rang === e[0].rang_final;
    if (ok) ptsOrd += cfg.pts_ordre;
    var sub = "mon rang : " + (e[1].rang ? "Nº" + e[1].rang : "—") + " · réel : " + (e[0].rang_final ? "Nº" + e[0].rang_final : "hors top 5");
    return mini(e[0], ok, sub);
  }).join("");
  var hE = [1, 2].map(function (n) {
    var e = essais[n];
    if (!e) return '<p class="muted small">Essai ' + n + ' : — non joué —</p>';
    var ok = e[0].rang_final === 1;
    if (ok) { if (n === 1) ptsE1 = cfg.pts_essai1; else ptsE2 = cfg.pts_essai2; }
    return '<h3>Essai ' + n + ' <span class="small muted">(' + (n === 1 ? cfg.pts_essai1 : cfg.pts_essai2) + ' pts si trouvée)</span></h3>' + mini(e[0], ok);
  }).join("");

  var qcm = Number(S.profil.points_qcm) || 0;
  var total = pts15 + pts5 + ptsOrd + ptsE1 + ptsE2 + qcm;

  var h = '<h2>Mon résultat</h2>';
  if (ph === "cloture") h += '<p class="small muted">🔴 En direct : les points se mettent à jour au fil des annonces (la page se rafraîchit toute seule).</p>';
  h += '<div class="card center"><span class="eyebrow">Total général</span><h1 style="font-size:2.6rem;margin:0.1rem">' + total + ' pts</h1>'
    + '<p class="small muted">15 Miss : <b>' + pts15 + '</b> · 5 Miss : <b>' + pts5 + '</b> · Bon ordre : <b>' + ptsOrd + '</b> · Essais : <b>' + (ptsE1 + ptsE2) + '</b> · QCM : <b>' + qcm + '</b></p></div>';

  h += '<div class="card"><h3>15 Miss sélectionnées <span class="small muted">(' + cfg.pts_top15 + ' pts par Miss trouvée)</span> — <span class="cnt">' + pts15 + ' pts</span></h3>' + (h15 || '<p class="muted small">Aucune sélection.</p>') + '</div>';
  h += '<div class="card"><h3>5 Miss sélectionnées <span class="small muted">(' + cfg.pts_top5 + ' pts par Miss trouvée)</span> — <span class="cnt">' + pts5 + ' pts</span></h3>' + (h5 || '<p class="muted small">Aucune finaliste.</p>') + '</div>';
  h += '<div class="card"><h3>5 Miss dans le bon ordre <span class="small muted">(' + cfg.pts_ordre + ' pts par bon rang)</span> — <span class="cnt">' + ptsOrd + ' pts</span></h3>' + (hOrd || '<p class="muted small">Aucun classement.</p>') + '</div>';
  h += '<div class="card"><h3>2 essais Miss France — <span class="cnt">' + (ptsE1 + ptsE2) + ' pts</span></h3>' + hE + '</div>';
  h += '<div class="card"><h3>QCM — <span class="cnt">' + qcm + ' pts</span></h3><p class="small muted">Notés à la main par le président du jury, décimales vexantes incluses.</p></div>';
  return h;
}

// ----- Benchmark -----
function viewBenchmark() {
  var h = '<h2>Benchmark</h2>';
  if (S.res === null) return h + '<div class="card center muted">Dépouillement en cours… 🗳️</div>';
  if (S.res.err) return h + '<div class="card center muted">' + esc(S.res.err) + '</div>';
  if (!S.res.length) return h + '<div class="card center muted">Aucun joueur.</div>';

  var rows = S.res.map(function (j) {
    var total = Number(j.pts_qcm) + j.pts_15 + j.pts_5 + j.pts_ordre + j.pts_essai1 + j.pts_essai2;
    return Object.assign({}, j, { total: total });
  });
  rows.sort(function (a, b) { return b.total - a.total; });

  function chart(title, key) {
    var max = 0;
    rows.forEach(function (r) { max = Math.max(max, Number(r[key])); });
    var hh = '<div class="card"><h3>' + title + '</h3>';
    rows.slice().sort(function (a, b) { return Number(b[key]) - Number(a[key]); }).forEach(function (r) {
      var v = Number(r[key]);
      var w = max ? Math.max(2, Math.round(v / max * 100)) : 2;
      var me = S.profil && r.pseudo === S.profil.pseudo;
      hh += '<div class="bar' + (me ? " me" : "") + '"><span class="lbl">' + esc(r.nom_affiche) + '</span>'
        + '<span class="track"><span class="fill" style="width:' + w + '%"></span></span>'
        + '<span class="val">' + v + '</span></div>';
    });
    return hh + "</div>";
  }

  h += chart("Classement général", "total");
  h += chart("QCM", "pts_qcm");
  h += chart("Choix des 15 Miss", "pts_15");
  h += chart("Choix des 5 Miss", "pts_5");
  h += chart("Les 5 dans l'ordre", "pts_ordre");
  h += chart("Essai Miss France Nº1", "pts_essai1");
  h += chart("Essai Miss France Nº2", "pts_essai2");

  h += '<h2>Le podium des jurés</h2>';
  rows.forEach(function (r, i) {
    var medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : "Nº" + (i + 1);
    h += '<div class="card"><div class="row">' + avatarHtml(r.nom_affiche, r.photo_url, false)
      + '<div style="flex:1"><b style="font-size:1.05rem">' + medal + ' ' + esc(r.nom_affiche) + '</b>'
      + '<div class="small muted">QCM ' + r.pts_qcm + ' · 15 Miss ' + r.pts_15 + ' · 5 Miss ' + r.pts_5 + ' · Ordre ' + r.pts_ordre + ' · Essais ' + (r.pts_essai1 + r.pts_essai2) + '</div></div>'
      + '<div class="cnt" style="font-size:1.4rem">' + r.total + ' pts</div></div></div>';
  });
  return h;
}

// ----- Admin -----
function viewAdmin() {
  if (!S.profil.est_admin) return "";
  var cfg = S.config;
  var h = '<h2>🎛️ La régie de l\'organisateur</h2>';

  h += '<div class="card"><h3>Phase du jeu</h3><p class="small muted">Change la phase pour faire avancer tout le monde en même temps.</p>'
    + '<select class="inp" onchange="App.aPhase(this)">';
  Object.keys(PHASES).forEach(function (k) {
    h += '<option value="' + k + '"' + (cfg.phase === k ? " selected" : "") + '>' + PHASES[k].label + '</option>';
  });
  h += '</select></div>';

  h += '<div class="card"><h3>Résultats réels des Miss</h3>'
    + '<p class="small muted">Le soir de l\'élection : coche « Top 15 » au fil des annonces, puis choisis les rangs 1 à 5. Chaque coche recalcule tous les scores instantanément.</p>';
  if (!S.candidates.length) {
    h += '<p class="muted small">Aucune candidate — ajoute-les dans Supabase (Table Editor → mf_candidates).</p>';
  } else {
    h += '<div style="overflow-x:auto"><table class="adm"><thead><tr><th>Miss</th><th>Top 15</th><th>Rang final</th><th></th></tr></thead><tbody>';
    S.candidates.forEach(function (x) {
      h += '<tr><td><b>' + esc(x.nom) + '</b><br><span class="small muted">Miss ' + esc(x.region) + '</span></td>'
        + '<td><input type="checkbox" id="adm-t15-' + x.id + '"' + (x.dans_top15 ? " checked" : "") + '></td>'
        + '<td><select class="inp" id="adm-rang-' + x.id + '"><option value="">—</option>';
      for (var i = 1; i <= 5; i++) h += '<option value="' + i + '"' + (x.rang_final === i ? " selected" : "") + '>Nº' + i + '</option>';
      h += '</select></td><td>' + btn("App.aResultat(" + x.id + ")", "💾", "mini") + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  h += '<div class="card"><h3>Joueurs : PIN &amp; points QCM</h3>';
  if (!S.admJoueurs) {
    h += '<p class="muted small">Chargement…</p>';
  } else {
    h += '<div style="overflow-x:auto"><table class="adm"><thead><tr><th>Joueur</th><th>PIN</th><th>Points QCM</th><th></th></tr></thead><tbody>';
    S.admJoueurs.forEach(function (j) {
      h += '<tr><td><b>' + esc(j.nom_affiche) + '</b>' + (j.est_admin ? ' <span class="badge gold">régie</span>' : "") + '<br><span class="small muted">' + esc(j.pseudo) + '</span></td>'
        + '<td><span class="badge dark">' + esc(j.pin) + '</span></td>'
        + '<td><input class="inp" style="width:5rem" type="number" step="0.1" id="adm-qcm-' + j.id + '" value="' + esc(j.points_qcm) + '"></td>'
        + '<td>' + btn("App.aQcm(" + j.id + ")", "💾", "mini") + '</td></tr>';
    });
    h += '</tbody></table></div><p class="small muted">Pour changer un PIN ou une photo : Supabase → Table Editor → mf_joueurs.</p>';
  }
  h += '</div>';
  return h;
}

// ----- Fiche candidate (modale) -----
function viewFiche() {
  if (S.fiche == null) return "";
  var x = S.candidates.find(function (c) { return c.id === S.fiche; });
  if (!x) return "";
  var p = S.mine[x.id];
  var h = '<div class="modal-bg" onclick="if(event.target===this)App.closeFiche()"><div class="modal">'
    + '<button class="close" onclick="App.closeFiche()" aria-label="Fermer">✕</button>'
    + '<div class="bigph">' + missPhoto(x, S.ficheSurprise) + '</div>';
  if (x.photo_surprise_url) h += '<p class="center" style="margin:0 0 0.5rem">' + btn("App.surprise()", S.ficheSurprise ? "Remettre la vraie photo" : "Surprise 🎁", "mini") + '</p>';
  h += '<h2 class="center" style="margin:0.2rem 0 0">' + esc(x.nom) + '</h2>'
    + '<p class="center" style="color:var(--pink);font-weight:700;margin:0.1rem 0 0.6rem">Miss ' + esc(x.region) + '</p>'
    + '<ul class="small" style="color:var(--text)">'
    + (x.age ? "<li>" + esc(x.age) + " ans</li>" : "")
    + (x.taille ? "<li>" + esc(x.taille) + "</li>" : "")
    + (x.profession ? "<li>" + esc(x.profession) + "</li>" : "")
    + '</ul><div class="center">' + statutBadge(p) + '</div>'
    + '<div class="center" style="margin-top:0.6rem">' + missActions(x) + '</div>'
    + '</div></div>';
  return h;
}

// ------------------------------------------------------------------
// Rafraîchissement automatique pendant la soirée
// ------------------------------------------------------------------
setInterval(function () {
  if (!S.session || !S.config) return;
  var ph = S.config.phase;
  var focused = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (focused || S.fiche != null) return;
  if (ph === "cloture" || ph === "resultats") {
    Promise.all([loadConfig(), loadCandidates(), loadProfil()]).then(function () {
      if (S.tab === "benchmark") loadBenchmark(); else render();
    }).catch(function () {});
  } else {
    Promise.all([loadConfig(), loadProfil()]).then(function () { render(); }).catch(function () {});
  }
}, 45000);

boot();
</script>
</body>
</html>
